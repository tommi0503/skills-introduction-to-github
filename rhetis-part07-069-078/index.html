<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhetis · 5개 디자인 컬렉션</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f2f4;color:#17202b;font:15px system-ui,sans-serif}header{padding:28px 40px;background:white;border-bottom:1px solid #dde1e7}h1{font-size:25px;margin:0 0 8px}header p{margin:0;color:#596575}nav{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:20px 40px}select,button,a{font:inherit}select,button{padding:10px 14px;background:white;border:1px solid #bcc5d0;border-radius:6px}button{cursor:pointer}button.on{background:#17202b;color:white}nav a{color:#173c77;margin-left:auto}.stage{margin:0 40px;background:white;box-shadow:0 4px 24px #17202b12;overflow:hidden;position:relative;aspect-ratio:16/9;max-width:1280px}iframe{border:0;width:1280px;height:720px;transform-origin:top left}.stage img{display:none;width:100%;height:100%;object-fit:contain}.downloads{display:flex;gap:24px;flex-wrap:wrap;padding:20px 40px}.downloads a{color:#173c77}.caption{padding:0 40px 30px;color:#596575;font-size:13px}footer{padding:22px 40px;border-top:1px solid #dde1e7;background:white;font-size:13px;color:#596575}</style><header><h1>Rhetis · 다섯 개의 디자인 언어</h1><p>5개 덱 · 112장 · 컬렉션별 foundation + 56개 요소</p></header><nav><select id="deck"><option value="vectorbox">069 · vectorbox (12장)</option><option value="seedmark">072 · seedmark (21장)</option><option value="crossrail">073 · crossrail (30장)</option><option value="meridian-deck">074 · meridian-deck (30장)</option><option value="onboard-docket">078 · onboard-docket (19장)</option></select><select id="page"></select><button class="on" data-stage="replica">원본 재현</button><button data-stage="reassembled">라이브러리 재조립</button><button data-stage="compare-replica">원본 | 재현</button><button data-stage="compare-reassembled">원본 | 재조립</button><button data-stage="triple">원본 | 재현 | 조립</button><button data-stage="overlay">재현·조립 겹침</button><a id="notes">검수 기록</a></nav><div class="stage"><iframe title="슬라이드 미리보기"></iframe><img alt="원본과 나란히 비교"></div><div class="downloads"><a id="collectionZip">컬렉션 ZIP</a><a id="reviewZip">검수 자료 ZIP</a><a id="light">요소 시트 · 라이트</a><a id="dark">요소 시트 · 다크</a><a id="design">디자인 언어</a></div><p class="caption">사진·복잡한 그래픽은 요청에 따라 회색 placeholder로 표시했습니다. 원본과의 차이·판독 불가 문구·구현 판단은 각 검수 기록에 있습니다.</p><footer>컬렉션의 디자인 CSS는 팔레트의 역할만 참조합니다. 재조립에는 원본의 색을 공급하는 별도 style 입력을 사용합니다.</footer><script>const slides={"vectorbox": ["slide_02.html", "slide_03.html", "slide_04.html", "slide_05.html", "slide_06.html", "slide_07.html", "slide_08.html", "slide_09.html", "slide_10.html", "slide_11.html", "slide_12.html", "slide_13.html"], "seedmark": ["slide_01.html", "slide_02.html", "slide_03.html", "slide_04.html", "slide_05.html", "slide_06.html", "slide_07.html", "slide_08.html", "slide_09.html", "slide_10.html", "slide_11.html", "slide_12.html", "slide_13.html", "slide_14.html", "slide_15.html", "slide_16.html", "slide_17.html", "slide_18.html", "slide_19.html", "slide_20.html", "slide_21.html"], "crossrail": ["slide_01.html", "slide_02.html", "slide_03.html", "slide_04.html", "slide_05.html", "slide_06.html", "slide_07.html", "slide_08.html", "slide_09.html", "slide_10.html", "slide_11.html", "slide_12.html", "slide_13.html", "slide_14.html", "slide_15.html", "slide_16.html", "slide_17.html", "slide_18.html", "slide_19.html", "slide_20.html", "slide_21.html", "slide_22.html", "slide_23.html", "slide_24.html", "slide_25.html", "slide_26.html", "slide_27.html", "slide_28.html", "slide_29.html", "slide_30.html"], "meridian-deck": ["slide_01.html", "slide_02.html", "slide_03.html", "slide_04.html", "slide_05.html", "slide_06.html", "slide_07.html", "slide_08.html", "slide_09.html", "slide_10.html", "slide_11.html", "slide_12.html", "slide_13.html", "slide_14.html", "slide_15.html", "slide_16.html", "slide_17.html", "slide_18.html", "slide_19.html", "slide_20.html", "slide_21.html", "slide_22.html", "slide_23.html", "slide_24.html", "slide_25.html", "slide_26.html", "slide_27.html", "slide_28.html", "slide_29.html", "slide_30.html"], "onboard-docket": ["slide_01.html", "slide_02.html", "slide_03.html", "slide_04.html", "slide_05.html", "slide_06.html", "slide_07.html", "slide_08.html", "slide_09.html", "slide_10.html", "slide_11.html", "slide_12.html", "slide_13.html", "slide_14.html", "slide_15.html", "slide_16.html", "slide_17.html", "slide_18.html", "slide_19.html"]};let stage='replica';const deck=document.querySelector('#deck'),pg=document.querySelector('#page'),frame=document.querySelector('iframe'),img=document.querySelector('.stage img');function pages(){pg.innerHTML=slides[deck.value].map(s=>'<option>'+s+'</option>').join('');update()}function update(){let k=deck.value,p=pg.value,base=k+'-project/';let imageStage=stage.startsWith('compare')||stage==='triple'||stage==='overlay';frame.style.display=imageStage?'none':'block';img.style.display=imageStage?'block':'none';document.querySelector('.stage').style.aspectRatio=stage==='triple'?'48/9':stage.startsWith('compare')?'32/9':'16/9';frame.src=base+stage+'/'+p;img.src=['triple','overlay'].includes(stage)?base+'fidelity/'+p.replace('.html','-'+stage+'.png'):base+stage+'/'+p.replace('.html','.png');for(let [id,path] of Object.entries({notes:'review-notes.md',light:'library/light.html',dark:'library/dark.html',design:'design-language.md'}))document.getElementById(id).href=base+path;document.getElementById('collectionZip').href='downloads/'+k+'.zip';document.getElementById('reviewZip').href='downloads/'+k+'-review.zip';document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.stage===stage));scale()}function scale(){frame.style.transform='scale('+document.querySelector('.stage').clientWidth/1280+')'}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;update()});deck.onchange=pages;pg.onchange=update;window.onresize=scale;pages();</script></html>

<!doctype html><style>body{margin:0}.plot{width:600px;height:400px;position:relative;transform:translateX(0);anchor-scope:all;border:1px solid #aaa}.pt{position:absolute;width:6px;height:6px;background:#333;border-radius:50%;bottom:calc(var(--v)*1%)}.pt:nth-child(1){left:5%;anchor-name:--p1}.pt:nth-child(2){left:50%;anchor-name:--p2}.pt:nth-child(3){left:95%;anchor-name:--p3}.pt:before,.pt:after{content:'';position:fixed;left:anchor(var(--prev) center);right:anchor(var(--curr) center);background:linear-gradient(to bottom right,transparent calc(50% - 1px),#f00 calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px));pointer-events:none}.pt:before{top:anchor(var(--curr) center);bottom:anchor(var(--prev) center)}.pt:after{top:anchor(var(--prev) center);bottom:anchor(var(--curr) center);background:linear-gradient(to top right,transparent calc(50% - 1px),#f00 calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px))}.pt:nth-child(2){--prev:--p1;--curr:--p2}.pt:nth-child(3){--prev:--p2;--curr:--p3}.pt:nth-child(1):before,.pt:nth-child(1):after{display:none}</style><div class="plot"><div class="pt" style="--v:20"></div><div class="pt" style="--v:80"></div><div class="pt" style="--v:40"></div></div>

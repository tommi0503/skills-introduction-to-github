<div class="prose" style="grid-column:1 / span 12; grid-row:1 / span 6" data-el="confetti-prose"><p>지난 분기 우리는 영업, 운영, 재무 세 부서의 업무 기록을 하나의 작업 공간으로 옮겼습니다. 같은 숫자를 세 번 옮겨 적던 일이 사라지면서 <b>주간 보고 준비 시간이 절반으로</b> 줄었습니다.</p><p>남은 과제는 현장 팀의 참여입니다. 모바일에서 바로 기록할 수 있도록 입력 화면을 단순하게 바꾸고, 다음 분기에는 물류 센터 두 곳에서 먼저 시범 운영합니다.</p></div>

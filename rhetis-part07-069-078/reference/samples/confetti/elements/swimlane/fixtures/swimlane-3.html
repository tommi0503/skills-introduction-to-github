<!-- min: 8x4 -->
<div class="swimlane" style="grid-column:1 / span 12; grid-row:1 / span 6; --cols:4" data-el="confetti-swimlane">
  <div class="lane" style="grid-row:1"><b class="name">고객</b></div>
  <div class="lane" style="grid-row:2"><b class="name">영업팀</b></div>
  <div class="lane" style="grid-row:3"><b class="name">법무팀</b></div>
  <div class="node start to-d" style="grid-column:1; grid-row:1"><b class="name">견적 요청</b></div>
  <div class="node to-r" style="grid-column:1; grid-row:2"><b class="name">요건 확인</b></div>
  <div class="node ask to-r to-d" style="grid-column:2; grid-row:2"><b class="name">표준 계약?</b></div>
  <div class="node to-u" style="grid-column:3; grid-row:2"><b class="name">견적서 발송</b></div>
  <div class="node end" style="grid-column:3; grid-row:1"><b class="name">계약 체결</b></div>
  <div class="node to-r" style="grid-column:2; grid-row:3"><b class="name">조항 검토</b></div>
  <div class="node to-u" style="grid-column:3; grid-row:3"><b class="name">수정안 승인</b></div>
</div>

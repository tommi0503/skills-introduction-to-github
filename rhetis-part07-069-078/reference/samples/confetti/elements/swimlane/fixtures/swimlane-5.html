<!-- min: 10x5 -->
<div class="swimlane" style="grid-column:1 / span 12; grid-row:1 / span 6; --cols:5" data-el="confetti-swimlane">
  <div class="lane" style="grid-row:1"><b class="name">고객</b></div>
  <div class="lane" style="grid-row:2"><b class="name">상담센터</b></div>
  <div class="lane" style="grid-row:3"><b class="name">물류</b></div>
  <div class="lane" style="grid-row:4"><b class="name">품질팀</b></div>
  <div class="lane" style="grid-row:5"><b class="name">재무</b></div>
  <div class="node start to-d" style="grid-column:1; grid-row:1"><b class="name">반품 접수</b></div>
  <div class="node to-r" style="grid-column:1; grid-row:2"><b class="name">사유 확인</b></div>
  <div class="node to-d" style="grid-column:2; grid-row:2"><b class="name">회수 요청</b></div>
  <div class="node to-r" style="grid-column:2; grid-row:3"><b class="name">상품 회수</b></div>
  <div class="node to-d" style="grid-column:3; grid-row:3"><b class="name">입고</b></div>
  <div class="node ask to-r" style="grid-column:3; grid-row:4"><b class="name">불량?</b></div>
  <div class="node on to-d" style="grid-column:4; grid-row:4"><b class="name">검수 완료</b></div>
  <div class="node to-r" style="grid-column:4; grid-row:5"><b class="name">환불 처리</b></div>
  <div class="node end" style="grid-column:5; grid-row:5"><b class="name">완료 안내</b></div>
</div>

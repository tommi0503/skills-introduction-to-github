<div class="steps col" data-el="crossrail-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark"><span class="icon" data-icon="lightbulb"></span>01</span><p class="name">인지</p><p class="note">읽는 이에게 전체적인 방향성을 제시하고 프로젝트에 대한 기대감을 심어주는 도입부 역할을 합니다.</p></div><div class="step"><span class="mark"><span class="icon" data-icon="search"></span>02</span><p class="name">탐색</p><p class="note">객관적인 수치나 근거 자료를 제시하여 분석의 신뢰도를 높이고 논리적인 타당성을 확보해야 해요.</p></div><div class="step"><span class="mark"><span class="icon" data-icon="credit-card"></span>03</span><p class="name">구매</p><p class="note">아이디어 선정 기준과 이유를 명확히 명시하면 기획의 설득력이 높아지고 공감을 얻기 쉽습니다.</p></div><div class="step"><span class="mark"><span class="icon" data-icon="message-circle"></span>04</span><p class="name">리뷰</p><p class="note">막연했던 아이디어가 체계적인 실행 계획으로 구체화되는 과정을 보여주어 신뢰도를 높여 보세요.</p></div></div>

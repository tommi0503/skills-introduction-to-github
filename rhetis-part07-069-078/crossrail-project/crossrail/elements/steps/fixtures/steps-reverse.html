<div class="steps" data-el="crossrail-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">01</span><p class="name">노출</p><p class="note">프로젝트의 정의와 범위를 명확히 설정하여 앞으로 전개될 내용의 길잡이 역할을 하는 단계입니다.</p></div><div class="step"><span class="mark">02</span><p class="name">유입</p><p class="note">내부 역량과 외부 환경을 종합적으로 분석하여 우리가 가진 강점과 약점을 명확히 파악해 보세요.</p></div><div class="step"><span class="mark">03</span><p class="name">활동</p><p class="note">시장의 빈틈을 파고드는 전략을 수립하여 프로젝트가 성공할 수밖에 없는 이유를 증명해 보세요.</p></div></div>

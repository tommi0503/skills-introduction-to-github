<div class="steps" data-el="crossrail-steps" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="step"><span class="mark">1 STEP</span><p class="name"><span class="icon" data-icon="goal"></span>노출</p><p class="note">왜 이 프로젝트가 시작되었는지 그리고 어떤 문제를 해결하고자 하는지 구체적으로 서술해 보세요.</p></div><div class="step"><span class="mark">2 STEP</span><p class="name"><span class="icon" data-icon="lightbulb"></span>실행</p><p class="note">문제의 원인을 정확히 파악해야 올바른 해결책이 나올 수 있으니 현상을 깊이 있게 분석하세요.</p></div><div class="step"><span class="mark">3 STEP</span><p class="name"><span class="icon" data-icon="search"></span>점검</p><p class="note">다양한 해결 방안을 모색하는 브레인스토밍을 통해 도출된 아이디어 중 핵심을 추려내야 합니다.</p></div></div>

<div class="list divided" data-el="crossrail-list" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="item"><p class="name">노출</p><p class="note">다양한 자료 중 핵심만 남기는 과정을 보여주세요. 위쪽에는 전체 데이터를 두고 아래쪽에는 최종 결과를 배치해 집중을 시각화합니다.</p></div><div class="item"><p class="name">유입</p><p class="note">시선이 자연스럽게 아래로 모이는 역삼각형 구조를 활용해 보세요. 상단에서 시작해 하단으로 내려갈수록 정보가 구체화됩니다.</p></div><div class="item"><p class="name">구매</p><p class="note">전체 시장에서 거점 시장으로 범위를 좁혀가며 타겟의 선명도를 높이세요. 대상은 줄어들지만 공략해야 할 대상이 누구인지 명확히 정의 내는 과정을 담습니다.</p></div></div>

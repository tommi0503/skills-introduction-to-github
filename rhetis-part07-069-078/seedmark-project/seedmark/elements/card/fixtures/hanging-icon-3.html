<div class="group " style="grid-column:1 / span 12;grid-row:1 / span 6;"><div class="card " data-el="seedmark-card"><div class="parts"><span class="mark"><span class="icon" data-icon="settings"></span></span><p class="kick">PAIN POINT 01</p><h3 class="name">비효율성</h3><p class="note">고객이 어떤 불편함을 느끼고 시간/비용<br>적으로 얼마나 손해를 보고 있는지 구체<br>적인 수치로 설명하세요.</p></div></div><div class="card line" data-el="seedmark-card"><div class="parts"><span class="mark"><span class="icon" data-icon="shopping-cart"></span></span><p class="kick">PAIN POINT 02</p><h3 class="name">높은 비용</h3><p class="note">기존의 방식이나 해결책이 왜 비싸고 접<br>근하기 어려운지, 그로 인해 어떤 기회비<br>용이 발생하는지 설명하세요.</p></div></div><div class="card " data-el="seedmark-card"><div class="parts"><span class="mark"><span class="icon" data-icon="pencil-line"></span></span><p class="kick">PAIN POINT 03</p><h3 class="name">정보 부족</h3><p class="note">고객이 올바른 결정을 내리는 데 필요한<br>정보가 왜 부족하거나 비대칭적인지, 어<br>떤 부정적 결과를 낳는지 보여주세요.</p></div></div></div>

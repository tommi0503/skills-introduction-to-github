<div class="prose cols" data-el="afterglow-prose" style="grid-column:1 / span 12;grid-row:1 / span 6"><p>납품 요일을 권역별로 묶어 배차 횟수와 빈 차량의 이동 구간을 함께 살폈습니다.</p><p>정시 도착률은 높아졌지만 야간 인계가 몰리는 거점에는 별도의 검수표가 필요했습니다.</p><p>다음 회차에는 지연 사유를 접수 단계부터 구분하고, 예외 물량의 인계 기준을 먼저 맞춥니다.</p><p>실증 결과는 거래처별로 나누어 공유하고 추가 검증이 필요한 경로만 다시 조정합니다.</p></div>

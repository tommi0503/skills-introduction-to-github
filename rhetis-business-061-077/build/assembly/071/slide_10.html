.slide { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--page); color: var(--ink); font-family: var(--font-body); font-size: var(--type-20); font-weight: var(--body-weight); line-height: var(--body-line); letter-spacing: var(--body-track); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }

.slide :is(h1,h2,h3,p,blockquote) { margin: 0; }
.slide > .page { position: absolute; inset: var(--margin-y) var(--margin-x); display: flex; flex-direction: column; gap: var(--gap-lg); }
.slide:has(> .top) > .page { top: calc(var(--furn-edge) + var(--top-h) + var(--furn-gap)); }
.slide:has(> .foot) > .page { bottom: calc(var(--furn-edge) + var(--foot-h) + var(--furn-gap)); }
.slide:has(> .rail) > .page { left: calc(var(--rail-w) + var(--rail-gap)); }
.slide .head { flex: none; display: flex; flex-direction: column; gap: var(--gap-sm); padding-bottom: var(--gap); border-bottom: var(--stroke) solid var(--line); }
.slide .head.center { text-align: center; align-items: center; }
.slide .kicker { color: var(--accent); font-size: var(--type-14); font-weight: var(--label-weight); line-height: var(--label-line); letter-spacing: var(--label-track-latin); }
.slide .title { font-family: var(--font-display); font-size: var(--type-40); font-weight: var(--title-weight); line-height: var(--title-line); letter-spacing: var(--title-track); }
.slide .lead { color: var(--ink-2); font-size: var(--type-18); font-weight: var(--lead-weight); line-height: var(--lead-line); letter-spacing: var(--lead-track); }
.slide .body { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(12,minmax(0,1fr)); grid-template-rows: repeat(6,minmax(0,1fr)); gap: var(--gap); }
.slide .body > * { min-width: 0; min-height: 0; }
.slide .group { display: flex; gap: var(--gap); min-width: 0; min-height: 0; }
.slide .group.col { flex-direction: column; }
.slide .group > * { flex: 1; min-width: 0; min-height: 0; }
.slide .group.two, .slide .group.three { display: grid; grid-auto-rows: minmax(0,1fr); }
.slide .group.two { grid-template-columns: repeat(2,minmax(0,1fr)); }
.slide .group.three { grid-template-columns: repeat(3,minmax(0,1fr)); }
.slide .stack { display: flex; flex-direction: column; gap: var(--gap-sm); min-width: 0; min-height: 0; }
.slide .split { display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr); gap: var(--gap); min-width: 0; min-height: 0; }
.slide .split.wide-left { grid-template-columns: minmax(0,7fr) minmax(0,5fr); }
.slide .split > * { min-width: 0; min-height: 0; }
.slide .icon { width: 1.2em; height: 1.2em; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.slide .icon > svg { width: 100%; height: 100%; }
.slide > :is(.top,.foot) { position: absolute; left: var(--margin-x); right: var(--margin-x); display: flex; align-items: center; gap: var(--gap); color: var(--mute); font-size: var(--type-12); font-weight: var(--label-weight); line-height: var(--label-line); }
.slide > .top { top: var(--furn-edge); height: var(--top-h); border-bottom: var(--stroke) solid var(--line); }
.slide > .foot { bottom: var(--furn-edge); height: var(--foot-h); border-top: var(--stroke) solid var(--line); }
.slide > :is(.top,.foot) > .sec { color: var(--accent); }
.slide > :is(.top,.foot) > :is(.src,.no) { margin-left: auto; }

.slide > .rail { position: absolute; inset: 0 auto 0 0; width: var(--rail-w); background: var(--tone-1); color: var(--tone-1-ink); display: flex; flex-direction: column; align-items: center; gap: var(--gap); padding: var(--margin-y) var(--gap-sm); font-size: var(--type-16); font-weight: var(--label-weight); line-height: var(--label-line); }

<!-- min: 8x5 -->
<div class="flowchart" data-el="fluxweave-flowchart" style="grid-column:1 / span 12; grid-row:1 / span 6">
  <div class="node start to-r" style="grid-column:2; grid-row:3">접수</div>
  <div class="node ask to-l to-u" style="grid-column:3; grid-row:3">보완 필요?</div>
  <div class="node end" style="grid-column:3; grid-row:2">최종 승인</div>
  <div class="node to-d" style="grid-column:4; grid-row:2">담당 검토</div>
  <div class="node end" style="grid-column:4; grid-row:3">실행 안내</div>
</div>

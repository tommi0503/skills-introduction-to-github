<div class="group " style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="card on quiet tone-1" data-el="cyanloop-card"><div class="parts"><p class="kick">Goal 1</p><p class="name">조직 경쟁력 강화</p><p class="note">기업 비즈니스 방향과 연계된 전략적 교육을<br>통해 실질적인 성과 향상을 도모합니다.<br>교육이 단순히 학습에 머무르지 않고,<br>조직의 경쟁력을 실질적으로 견인하는<br>비즈니스 임팩트를 창출하도록 설계합니다.</p></div></div><div class="card on quiet tone-2" data-el="cyanloop-card"><div class="parts"><p class="kick">Goal 2</p><p class="name">직무 전문성 향상</p><div class="note"><div class="list divided" data-el="cyanloop-list"><div class="item"><span class="name">현업 최적화 직무 스킬 강화</span></div><div class="item"><span class="name">실무 적용률을 높이는 문제 해결 훈련</span></div><div class="item"><span class="name">직무별 핵심 역량 모델링 구축</span></div></div></div></div></div><div class="card on quiet tone-3" data-el="cyanloop-card"><div class="parts"><p class="kick">Goal 3</p><p class="name">미래 인재 육성</p><p class="note">신입부터 리더까지, 개인의 성장이 조직의<br>미래가 되는 맞춤형 로드맵을 운영합니다.</p></div></div></div>

<!-- min: 6x2 -->
<div class="swimlane" data-el="blockweave-swimlane" style="grid-column:1 / span 12; grid-row:1 / span 6;  --cols:3">
  <div class="lane" style="grid-row:1"><b class="name">고객</b></div>
  <div class="lane" style="grid-row:2"><b class="name">서비스팀</b></div>
  <div class="node start to-d" style="grid-column:1; grid-row:1"><b class="name">수리 요청</b></div>
  <div class="node to-r" style="grid-column:1; grid-row:2"><b class="name">원격 진단</b></div>
  <div class="node end to-u" style="grid-column:2; grid-row:2"><b class="name">방문 수리</b></div>
  <div class="node" style="grid-column:2; grid-row:1"><b class="name">완료 확인</b></div>
</div>

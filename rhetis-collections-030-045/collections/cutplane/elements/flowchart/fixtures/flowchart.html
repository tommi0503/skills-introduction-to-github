<!-- min: 6x3 -->
<div class="flowchart" data-el="cutplane-flowchart" style="grid-column:1 / span 12; grid-row:1 / span 6">
  <div class="node start to-r" style="grid-column:1; grid-row:1"><b class="name">주문 접수</b></div>
  <div class="node to-r" style="grid-column:2; grid-row:1"><b class="name">재고 확인</b></div>
  <div class="node ask to-r to-d" style="grid-column:3; grid-row:1"><b class="name">재고 충분?</b></div>
  <div class="node end" style="grid-column:4; grid-row:1"><b class="name">출하</b></div>
  <div class="node to-l" style="grid-column:3; grid-row:2"><b class="name">긴급 생산 요청</b></div>
  <div class="node to-u" style="grid-column:2; grid-row:2"><b class="name">생산 일정 조정</b></div>
</div>

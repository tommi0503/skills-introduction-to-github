<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Arrowtab reassembled 14</title><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../library/collection.css"><link rel="stylesheet" href="../library/source-palette.css"><style>html,body{margin:0;width:1280px;height:720px}</style></head><body><section class="slide"><div class="top"><span class="deck">BUSINESS PLAN</span></div><div class="page"><header class="head center"><p class="kicker">CHAPTER 12</p><h1 class="title">비즈니스 사이클</h1></header><div class="body"><div class="group" style="grid-column:1 / span 12;grid-row:1 / span 5"><div class="card line" data-el="arrowtab-card"><div class="parts"><p class="mark"><span class="icon" data-icon="radio"></span></p><p class="name">인지과정</p><p class="note">연결되어 끊임없이 반복되는 구조를 통해 지속적인 발전 과정을 보여주세요.</p></div></div><div class="card line" data-el="arrowtab-card"><div class="parts"><p class="mark"><span class="icon" data-icon="search"></span></p><p class="name">고려과정</p><p class="note">시계 방향으로 도는 순서를 배치하여 업무가 매끄럽게 진행됨을 강조하세요.</p></div></div><div class="card line" data-el="arrowtab-card"><div class="parts"><p class="mark"><span class="icon" data-icon="shopping-cart"></span></p><p class="name">구매과정</p><p class="note">멈춰있는 시스템이 아니라 움직이며 성장하는 생태계임을 보여주세요.</p></div></div><div class="card line" data-el="arrowtab-card"><div class="parts"><p class="mark"><span class="icon" data-icon="users"></span></p><p class="name">추천과정</p><p class="note">단계가 다음에 미치는 영향을 설명하고 상호 의존적인 관계임을 명확히 해요.</p></div></div></div><div class="callout" data-el="arrowtab-callout" style="grid-column:1 / span 12;grid-row:6 / span 1"><p><b><span>단계별 순환 과정</span></b><span>유기적으로 연결된 시스템으로, 요소 간 상호작용을 통해 전체 프로세스가 순환하고 발전합니다.</span></p></div></div></div></section><script src="../icons.js"></script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Arrowtab reassembled 6</title><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../library/collection.css"><link rel="stylesheet" href="../library/source-palette.css"><style>html,body{margin:0;width:1280px;height:720px}</style></head><body><section class="slide"><div class="top"><span class="deck">BUSINESS PLAN</span></div><div class="page"><header class="head center"><p class="kicker">CHAPTER 04</p><h1 class="title">사진이 있는 3단 페이지</h1></header><div class="body"><div class="group three" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="stack"><div class="card " data-el="arrowtab-card"><div class="parts"><p class="kick">TYPE 01</p><p class="name">신뢰를 주는 증거 사진</p><p class="note">주제와 관련된 사진을 넣고 핵심 내용을 요약해 적어보세요. 시각 자료를 활용하면 이해도를 높일 수 있습니다.</p></div></div><div class="frame" data-el="arrowtab-image-frame"><div class="seat" data-ph="1"></div></div></div><div class="stack"><div class="card " data-el="arrowtab-card"><div class="parts"><p class="kick">TYPE 02</p><p class="name">한 눈에 들어오는 배치</p><p class="note">비포 앤 애프터 비교나 기획부터 결과까지의 과정을 적어보세요. 좌우 배치는 자연스러운 스토리텔링을 만듭니다.</p></div></div><div class="frame" data-el="arrowtab-image-frame"><div class="seat" data-ph="2"></div></div></div><div class="stack"><div class="card tone-1" data-el="arrowtab-card"><div class="parts"><p class="kick">TYPE 02</p><p class="name">설명은 짧고 명확하게</p><p class="note">텍스트가 설명하고 이미지가 증명하는 구조는 읽는 사람에게 믿음을 줍니다. 한 장의 사진으로 신뢰를 얻으세요.</p></div></div><div class="frame" data-el="arrowtab-image-frame"><div class="seat" data-ph="3"></div></div></div></div></div></div></section><script src="../icons.js"></script></body></html>

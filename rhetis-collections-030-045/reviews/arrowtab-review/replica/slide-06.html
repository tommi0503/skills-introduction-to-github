<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="replica.css"><title>Arrowtab replica 6</title></head><body class="p06"><section class="slide"><div class="rail"></div><div class="band"><span>BUSINESS PLAN</span></div><div class="chapter">CHAPTER 04</div><h1 class="title" style="transform:translateX(-3px);">사진이 있는 3단 페이지</h1><div class="box" style="position:absolute;left:127px;top:306px;width:332px;height:361px;padding:48px 36px 24px;"><div class="tab">TYPE 01</div><h3>신뢰를 주는 증거 사진</h3><p>주제와 관련된 사진을 넣고 핵심 내용을<br>요약해 적어보세요. 시각 자료를 활용하면<br>이해도를 높일 수 있습니다.</p></div><div class="ph" style="position:absolute;left:127px;top:512px;width:332px;height:155px;"></div><div class="box" style="position:absolute;left:484px;top:306px;width:332px;height:361px;padding:48px 36px 24px;"><div class="tab">TYPE 02</div><h3>한 눈에 들어오는 배치</h3><p>비포 앤 애프터 비교나 기획부터 결과까지의<br>과정을 적어보세요. 좌우 배치는 자연스러운<br>스토리텔링을 만듭니다.</p></div><div class="ph" style="position:absolute;left:484px;top:512px;width:332px;height:155px;"></div><div class="box pink" style="position:absolute;left:841px;top:306px;width:332px;height:361px;padding:48px 36px 24px;"><div class="tab red">TYPE 02</div><h3>설명은 짧고 명확하게</h3><p>텍스트가 설명하고 이미지가 증명하는 구조는<br>읽는 사람에게 믿음을 줍니다. 한 장의 사진으<br>로 신뢰를 얻으세요.</p></div><div class="ph" style="position:absolute;left:841px;top:512px;width:332px;height:155px;"></div></section></body></html>

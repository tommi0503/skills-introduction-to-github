<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 휴먼 스토리 · 01</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-01" data-slide="01"><div class="placeholder" style="left:632px;top:40px;width:584px;height:640px"><span>환자 · 보호자 · 의료진의 일상 장면</span></div><div class="brand" style="left:64px;top:64px;width:440px;height:64px">EONU<span>이어온유</span></div><div class="cover-title heading" style="left:64px;top:240px;width:568px;height:160px">함께 오지 못해도,<br>이야기는 함께.</div><div class="cover-sub" style="left:68px;top:440px;width:468px;height:80px">환자와 보호자의 일상을<br>의료진의 질문에 연결합니다.</div><div class="edition" style="left:68px;top:632px;width:440px;height:40px">AI 소통 솔루션 · IR 2026.10</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

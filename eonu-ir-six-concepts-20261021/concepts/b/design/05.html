<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 그린 에디토리얼 · 05</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-05" data-slide="05"><aside class="chapter-rail"><div class="rail-brand">EONU</div><div class="rail-number">04</div><div class="rail-name">솔루션 · 병원에서 시작</div><div class="rail-vertical">이어지는 진료 · 세 사람의 안심</div></aside><div class="section-label">04. 솔루션 · 병원에서 시작</div><header class="heading"><h2>병원이 묻고, 일상에서 답합니다.</h2><p>질문·서비스 정보·관리 안내를 먼저 설정합니다.</p></header><div class="placeholder" style="left:176px;top:232px;width:356px;height:376px"><span>병원 설정과 안내를 사용하는 장면</span></div><div class="setup-tag" style="left:200px;top:256px;width:268px;height:40px">출발점은 의료진의 참여</div><div class="setup-flow" style="left:584px;top:232px;width:608px;height:144px"><span>의료진</span><b>→</b><strong>EONU</strong><b>→</b><span>환자 · 보호자</span></div><div class="setup-lines" style="left:584px;top:392px;width:608px;height:176px"><div><i>질문</i><span>다음 진료 전 확인할 항목</span></div><div><i>정보</i><span>병원의 서비스 정보</span></div><div><i>관리</i><span>진료 후 안내와 관리 계획</span></div></div><div class="qr-entry" style="left:584px;top:592px;width:608px;height:64px"><b>병원 안내 QR</b><span>→</span>병원과 연결된 화면에서 시작</div><footer class="slide-footer">설명용 제품 구조 · QR은 사용 시작 경로</footer><div class="page-number">05</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 그린 에디토리얼 · 02</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-02" data-slide="02"><aside class="chapter-rail"><div class="rail-brand">EONU</div><div class="rail-number">01</div><div class="rail-name">문제</div><div class="rail-vertical">이어지는 진료 · 세 사람의 안심</div></aside><div class="section-label">01. 문제</div><header class="heading"><h2>환자는 왔지만, 이야기는 오지 못했습니다.</h2><p>혼자 진료받는 아이와, 곁에 있지 못한 보호자.</p></header><div class="placeholder" style="left:176px;top:232px;width:584px;height:360px"><span>혼자 진료받는 아이 · 재구성한 설명용 장면</span></div><div class="scene-stamp" style="left:200px;top:256px;width:172px;height:36px">재구성한 사례</div><div class="quotes" style="left:808px;top:240px;width:384px;height:332px"><div><span>환자</span><strong>“언제부터였는지…<br>잘 모르겠어요.”</strong></div><div><span>보호자</span><strong>관찰을 알고 있지만,<br>지금 곁에 없습니다.</strong></div><div><span>의료진</span><strong>필요한 정보를<br>짧은 시간 안에.</strong></div></div><div class="statement" style="left:176px;top:616px;width:1016px;height:40px">동행의 부재가 만드는 <b>정보 전달의 공백.</b></div><footer class="slide-footer">설명을 위해 재구성한 사례</footer><div class="page-number">02</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

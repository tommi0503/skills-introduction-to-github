<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 클리니컬 에어 · 01</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-01" data-slide="01"><div class="cover-wordmark">eonu<span>이어온유</span></div><div class="cover-kicker">환자 · 보호자 · 의료진 AI 소통 솔루션</div><h1 class="cover-title">함께 오지 못해도,<br><em>이야기는 함께.</em></h1><div class="cover-orbit"><div class="orbit-ring"></div><div class="placeholder cover-stage"><span>가족과 진료를 연결하는 제품 이미지</span></div><span class="pill cover-patient">환자의 경험</span><span class="pill cover-family">보호자의 관찰</span><span class="pill cover-clinic">의료진의 질문</span><div class="cover-center">eonu<small>이어지는 진료, 세 사람의 안심</small></div></div><div class="cover-meta">EONU IR · 2026.10.21</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

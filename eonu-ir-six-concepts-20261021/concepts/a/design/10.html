<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 클리니컬 에어 · 10</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-10" data-slide="10"><div class="section-label">09. 현재와 다음</div><div class="heading"><h1>현장 피드백을, <em>첫 도입으로.</em></h1><p>질문과 템플릿, 제품에 반영할 운영 경험을 모으고 있습니다.</p></div><div class="evidence-ledger"><div class="ledger-title">현재 확인된 접점</div><div class="evidence-row"><span class="evidence-dot"></span><b>정신과 전문의 피드백</b><small>지속적 피드백 기재</small></div><div class="evidence-row"><span class="evidence-dot"></span><b>의료혁신 연구기관 접점</b><small>협의 범위 확인 필요</small></div><div class="evidence-row"><span class="evidence-dot"></span><b>청년 우울증 봉사 프로젝트</b><small>참여 확정 기재</small></div><p class="evidence-disclaimer">공식 제휴 · 실증 · 유료 계약 실적과 구분합니다.</p></div><div class="next-proof"><small>다음에 증명할 것</small><h3>접점을,<br><em>도입의 근거로.</em></h3><div class="proof-list"><span>의료진의 실제 활용</span><span>전체 업무 부담</span><span>반복 사용 · 구매 의사</span></div><p>질문 · 템플릿 · 운영 경험 축적</p></div><div class="slide-footer">현재 접점 · 공식 제휴·실증·유료 계약 실적과 구분</div><div class="page-number">10 / 12</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

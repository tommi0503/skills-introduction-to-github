<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 클리니컬 에어 · 04</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-04" data-slide="04"><div class="section-label">03. 병원의 참여 이유</div><div class="heading"><h1>환자의 걱정이, <em>병원의 상담 기회로.</em></h1><p>의료진이 계속 참여할 세 가지 이유. 먼저 수익 기여 가능성을 검증합니다.</p></div><div class="value-line"><div class="value-small"><span>01</span><b>진료 효율</b><p>전체 업무 부담 확인</p></div><div class="value-small"><span>02</span><b>임상적 유용성</b><p>진료에 쓰이는 정보 확인</p></div><div class="value-focus"><span>먼저 검증할 가설</span><b>수익 기여</b><p>자발적인 상담 요청과<br>병원의 지불 의사</p></div></div><div class="concern-path"><div><small>환자의 일상</small><b>미해결 걱정</b></div><i>→</i><div><small>병원이 제공한 정보</small><b>관련 서비스 탐색</b></div><i>→</i><div><small>환자의 선택</small><b>자발적인 상담</b></div></div><div class="ethical-note">AI가 개별 치료의 필요성을 판단하지 않습니다.</div><div class="slide-footer">사업 가설 · 비급여 필요성과 상담 전환 성과는 검증 전</div><div class="page-number">04 / 12</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

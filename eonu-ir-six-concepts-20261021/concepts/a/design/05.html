<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 클리니컬 에어 · 05</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-05" data-slide="05"><div class="section-label">04. 솔루션 · 병원에서 시작</div><div class="heading"><h1><em>병원이 묻고,</em> 일상에서 답합니다.</h1><p>질문·서비스 정보·관리 안내를 먼저 설정합니다.</p></div><div class="setup-ui"><div class="ui-top"><b>병원 설정</b><span>설명용 제품 UI</span></div><h3>다음 진료에 필요한 질문부터.</h3><div class="setup-row"><b>01</b><span>확인할 질문</span><em>최근 수면은 어땠나요?</em></div><div class="setup-row"><b>02</b><span>서비스 정보</span><em>병원이 제공한 안내</em></div><div class="setup-row"><b>03</b><span>진료 후 관리</span><em>일상에서 확인할 계획</em></div><div class="ui-bottom">의료진의 기준으로 설정</div></div><div class="start-arrow">→<small>병원 안내 QR</small></div><div class="entry-device"><div class="placeholder entry-stage"><span>환자 · 보호자 사용 시작 이미지</span></div><div class="device-caption">병원과 연결된 화면으로 입장</div></div><div class="slide-footer">설명용 제품 구조 · QR은 사용 시작 경로</div><div class="page-number">05 / 12</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 클리니컬 에어 · 12</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-12" data-slide="12"><div class="closing-brand">eonu<span>이어온유</span></div><h1 class="closing-title">환자에게 필요한 연결.<br><em>병원도 계속 쓸 이유.</em></h1><div class="closing-network"><svg class="closing-lines" viewBox="0 0 400 268" aria-hidden="true"><line x1="200" y1="36" x2="68" y2="224" class=""/><line x1="68" y1="224" x2="332" y2="224" class=""/><line x1="332" y1="224" x2="200" y2="36" class=""/></svg><span class="close-role cr-one">의료진</span><span class="close-role cr-two">환자</span><span class="close-role cr-three">보호자</span><b>eonu</b></div><div class="placeholder closing-stage"><span>세 사람의 안심을 잇는 서비스 이미지</span></div><div class="closing-thanks">이어지는 진료, 세 사람의 안심</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))

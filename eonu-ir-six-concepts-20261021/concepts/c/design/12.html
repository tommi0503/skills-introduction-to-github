<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 블루프린트 인덱스 · 12</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-12" data-slide="12"><div class="closing-brand" style="left:56px;top:44px;width:500px;height:40px">EONU / 이어온유</div><div class="closing-title" style="left:56px;top:172px;width:700px;height:200px">환자에게<br>필요한 연결.</div><div class="closing-title blue-text" style="left:56px;top:392px;width:700px;height:160px">병원도<br>계속 쓸 이유.</div><svg class="diagram" style="left:820px;top:388px;width:352px;height:252px" viewBox="0 0 352 252" aria-hidden="true"><path class="line faint" d="M176 40L40 212H312Z"/><path class="line active" d="M176 40V126"/><path class="line faint" d="M40 212L176 126"/><path class="line faint" d="M312 212L176 126"/><circle class="node" cx="176" cy="126" r="44"/><text class="svg-core" x="176" y="134" text-anchor="middle">EONU</text><text class="svg-label" x="176" y="24" text-anchor="middle">의료진</text><text class="svg-label" x="40" y="244" text-anchor="middle">환자</text><text class="svg-label" x="312" y="244" text-anchor="middle">보호자</text></svg><div class="placeholder" style="left:820px;top:76px;width:404px;height:264px"><span>함께 이어지는 일상 이미지</span></div><div class="rule" style="left:56px;top:620px;width:672px;height:2px"></div><div class="small-copy" style="left:56px;top:648px;width:700px;height:28px">첫 병원군과 함께, 실제로 쓰이고 지불할 가치를 검증합니다.</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

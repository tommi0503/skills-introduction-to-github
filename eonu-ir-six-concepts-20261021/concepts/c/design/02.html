<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 블루프린트 인덱스 · 02</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-02" data-slide="02"><div class="section-label" style="left:56px;top:32px;width:960px;height:28px">01. 문제</div><div class="chapter-number" style="left:56px;top:128px;width:144px;height:136px">01</div><div class="rail-brand" style="left:56px;top:608px;width:120px;height:24px">EONU / IR</div><div class="vertical-rule" style="left:196px;top:108px;width:2px;height:548px"></div><div class="heading" style="left:232px;top:104px;width:992px;height:132px">환자는 왔지만,<br>이야기는 오지 못했습니다.</div><div class="page-number" style="left:1184px;top:32px;width:40px;height:28px">02</div><div class="slide-footer" style="left:232px;top:684px;width:992px;height:24px">설명을 위해 재구성한 사례</div><div class="placeholder" style="left:232px;top:272px;width:544px;height:348px"><span>혼자 진료받는 아이 · 재구성 장면</span></div><div class="kicker" style="left:808px;top:272px;width:416px;height:28px">동행의 부재 → 정보의 공백</div><div class="rule" style="left:808px;top:316px;width:416px;height:2px"></div><div class="statement" style="left:808px;top:344px;width:400px;height:76px">“언제부터 달라졌나요?”</div><div class="copy" style="left:808px;top:440px;width:400px;height:132px">아이의 경험은 설명이 어렵고<br>보호자의 관찰은 현장에

v class="text " style="left:704px;top:348px;width:470px;height:72px;font-size:24px;line-height:36px;">유료 도입 검증 이후<br>환자·보호자의 추가 가치 탐색</div><div class="shape lav" style="left:704px;top:448px;width:512px;height:4px;"></div><div class="text strong" style="left:704px;top:488px;width:470px;height:40px;font-size:28px;line-height:42px;">별도 경로 / B2G</div><div class="text " style="left:704px;top:548px;width:470px;height:60px;font-size:22px;line-height:34px;">실제 구매기관 · 예산 · 공공 계약<br>연구지원금과 민간 봉사활동은 구분</div><div class="slide-footer">사업 모델 가설 · 첫 병원군과 가격은 선정·검증 중</div><div class="page-number">07</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

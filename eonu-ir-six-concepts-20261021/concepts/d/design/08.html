<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 퍼플 스테이지 · 08</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-08" data-slide="08"><div class="shape paper" style="left:0px;top:0px;width:1280px;height:720px;"></div><div class="section-label">07. 시장</div><div class="heading">큰 시장에서, <em>먼저 살 고객을 좁힙니다.</em></div><div class="subheading">현재 판매할 소프트웨어를 기준으로 TAM · SAM · SOM을 구분합니다.</div><svg class="diagram" style="left:64px;top:256px;width:576px;height:376px;" width="576" height="376" viewBox="0 0 576 376" xmlns="http://www.w3.org/2000/svg"><path d="M0 376V264A264 264 0 0 1 528 264V376Z" fill="#C8ACF4"/><path d="M80 376V272A184 184 0 0 1 448 272V376Z" fill="#7044C5"/><path d="M160 376V280A104 104 0 0 1 368 280V376Z" fill="#251044"/><text x="264" y="76" text-anchor="middle" fill="#251044" font-size="28" font-weight="600" font-family="Pretendard,sans-serif">TAM</text><text x="264" y="184" text-anchor="middle" fill="white" font-size="28" font-weight="600" font-family="Pretendard,sans-serif">SAM</text><text x="264" y="304" text-anchor="middle" fill="white" font-size="28" font-weight="600" font-family="Pretendard,sans-serif">SOM</text><text x="264" y="344" text-anchor="middle" fill="white" font-size="18" font-weight="600" font-family="Pretendard,sans-serif">먼저 확보할 고객</text></svg><div class="text strong" style="left:704px;top:264px;width:488px;height:40px;font-size:28px;line-height:42px;">구매 단위로 산정합니다.</div><div class="text " style="left:704px;top:328px;width:488px;height:56px;font-size:24px;line-height:36px;">B2B  /  기관 수 × 연간 가격</div><div class="text " style="left:704px;top:404px;width:488px;height:64px;font-size:22px;line-height:34px;">B2B2C  /  사용자 × 전환율 × 연간 지출</div><div class="text " style="left:704px;top:488px;width:488px;height:56px;font-size:24px;line-height:36px;">B2G  /  구매 건수 × 계약 금액</div><div class="text dim" style="left:704px;top:568px;width:488px;height:72px;font-size:20px;line-height:30px;">입력값·가격은 미확정<br>하드웨어·연구지원금·중복 계약 제외</div><div class="slide-footer">범위와 산식 개념도 · 면적은 금액에 비례하지 않으며 시장 수치·가격은 산정 전</div><div class="page-number">08</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

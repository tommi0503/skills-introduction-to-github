idth:240px;height:40px;font-size:28px;line-height:42px;">봉사 참여</div><div class="text " style="left:932px;top:408px;width:240px;height:88px;font-size:22px;line-height:34px;">청년 우울증 관련<br>프로젝트 운영 경험</div><div class="text strong" style="left:64px;top:588px;width:1152px;height:36px;font-size:26px;line-height:40px;">다음 검증  →  실제 활용  /  전체 업무 부담  /  반복 사용  /  구매 의사</div><div class="text dim" style="left:64px;top:636px;width:1100px;height:28px;font-size:18px;line-height:28px;">현재 접점은 공식 제휴·실증·유료 계약 실적으로 합산하지 않습니다.</div><div class="slide-footer">현재 접점 · 공식 제휴·실증·유료 계약 실적과 구분</div><div class="page-number">10</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

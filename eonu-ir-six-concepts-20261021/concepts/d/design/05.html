<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 퍼플 스테이지 · 05</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-05" data-slide="05"><div class="shape paper" style="left:0px;top:0px;width:1280px;height:720px;"></div><div class="section-label">04. 솔루션 · 병원에서 시작</div><div class="heading"><em>병원이 묻고,</em> 일상에서 답합니다.</div><div class="subheading">질문·서비스 정보·관리 안내를 먼저 설정합니다.</div><svg class="diagram" style="left:64px;top:276px;width:1152px;height:300px;" width="1152" height="300" viewBox="0 0 1152 300" xmlns="http://www.w3.org/2000/svg"><rect width="316" height="280" rx="24" fill="#251044"/><text x="158" y="68" text-anchor="middle" fill="white" font-size="28" font-weight="600" font-family="Pretendard,sans-serif">의료진이 먼저 설정</text><text x="158" y="132" text-anchor="middle" fill="#C8ACF4" font-size="24" font-weight="600" font-family="Pretendard,sans-serif">질문</text><text x="158" y="180" text-anchor="middle" fill="#C8ACF4" font-size="24" font-weight="600" font-family="Pretendard,sans-serif">서비스 정보</text><text x="158" y="228" text-anchor="middle" fill="#C8ACF4" font-size="24" font-weight="600" font-family="Pretendard,sans-serif">진료 후 관리 안내</text><path d="M336 140 L480 140" fill="none" stroke="#7044C5" stroke-width="4"/><path d="M468 132 L480 140 L468 148" fill="none" stroke="#7044C5" stroke-width="4"/><circle cx="616" cy="140" r="120" fill="#7044C5"/><text x="616" y="136" text-anchor="middle" fill="white" font-size="40" font-weight="600" font-family="Pretendard,sans-serif">EONU</text><text x="616" y="176" text-anchor="middle" fill="white" font-size="20" font-weight="600" font-family="Pretendard,sans-serif">병원의 질문을 전달</text><path d="M752 140 L844 140" fill="none" stroke="#7044C5" stroke-width="4"/><path d="M832 132 L844 140 L832 148" fill="none" stroke="#7044C5" stroke-width="4"/><rect x="864" y="20" width="288" height="240" rx="120" fill="#C8ACF4"/><text x="1008" y="112" text-anchor="middle" fill="#251044" font-size="28" font-weight="600" font-family="Pretendard,sans-serif">환자 · 보호자</text><text x="1008" y="160" text-anchor="middle" fill="#251044" font-size="24" font-weight="600" font-family="Pretendard,sans-serif">QR로 사용 시작</text><text x="1008" y="200" text-anchor="middle" fill="#251044" font-size="20" font-weight="400" font-family="Pretendard,sans-serif">일상에서 응답</text></svg><div class="text dim" style="left:64px;top:608px;width:1100px;height:40px;font-size:20px;line-height:30px;">병원 안내 QR은 진입 경로입니다. 실제 접속용 QR은 제공하지 않습니다.</div><div class="slide-footer">설명용 제품 구조 · QR은 사용 시작 경로</div><div class="page-number">05</div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

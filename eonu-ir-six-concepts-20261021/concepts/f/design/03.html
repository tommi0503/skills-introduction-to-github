<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 네이비 컨트롤 · 03</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-03" data-slide="03"><header class="slide-header"><div class="section-label">02. 연결의 가치</div><div class="header-brand">EONU<span>CARE COMMUNICATION</span></div></header><div class="heading"><h1><em>세 사람의 이야기,</em> 하나의 흐름으로.</h1><p>환자의 경험 · 보호자의 관찰 · 의료진의 질문과 계획</p></div><div class="connection-panel"><div class="triangle all"><svg viewBox="0 0 580 330" aria-label="환자 보호자 의료진과 EONU의 연결 구조"><defs><marker id="arr-03" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto-start-reverse"><path d="M0 0L16 8L0 16Z" fill="currentColor"/></marker></defs><path class="outer-line" d="M94 74L480 74L290 278Z"/><path class="link doctor-link" marker-end="url(#arr-03)" d="M420 90L336 130"/><path class="link patient-link" marker-end="url(#arr-03)" d="M150 92L242 130"/><path class="link" marker-end="url(#arr-03)" d="M288 220L288 240"/></svg><div class="role patient"><b>환자</b><span>일상의 경험</span></div><div class="role doctor"><b>의료진</b><span>질문과 계획</span></div><div class="role guardian"><b>보호자</b><span>관찰과 돌봄</span></div><div class="eonu-hub"><b>EONU</b><span>AI 소통</span></div></div><div class="care-return"><span>진료에서 확인한 관리 계획</span><b>일상으로 돌아가는 안내 ↩</b></div></div><div class="needs-panel"><div class="need-row"><span>01</span><div><b>환자</b><p>내 상황을 이해받고 싶습니다.</p></div></div><div class="need-row"><span>02</span><div><b>보호자</b><p>관찰을 전하고, 도울 일을 알고 싶습니다.</p></div></div><div class="need-row"><span>03</span><div><b>의료진</b><p>필요한 정보를 정리해 확인하고 싶습니다.</p></div></div></div><div class="takeaway "><span class="band-mark">↗</span>이야기를 정리하고, 역할과 공유 범위에 맞게 전달합니다.</div><footer class="slide-footer">서비스가 지향하는 연결 구조<span class="page-number">03</span></footer></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 네이비 컨트롤 · 01</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-01" data-slide="01"><div class="cover-wordmark">EONU<span>이어온유</span></div><div class="cover-copy"><div class="eyebrow">환자 · 보호자 · 의료진 AI 소통</div><h1>함께 오지 못해도,<br><em>이야기는 함께.</em></h1><p>일상의 이야기를 진료로,<br>진료의 계획을 다시 일상으로.</p><div class="cover-meta">IR PRESENTATION &nbsp; / &nbsp; 2026.10.21</div></div><div class="cover-media"><div class="placeholder "><span>환자·보호자·의료진의 연결 장면</span></div><div class="cover-media-tag"><span>CARE COMMUNICATION</span><b>세 사람의 안심을 만드는 연결</b></div></div><div class="cover-line"></div></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

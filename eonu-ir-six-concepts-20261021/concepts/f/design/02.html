<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONU 네이비 컨트롤 · 02</title><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../style.css"><style>html,body{width:100%;height:100%;overflow:hidden;background:#fff}.canvas-host{width:1280px;height:720px;position:absolute;transform-origin:0 0}@media print{.canvas-host{transform:none!important;left:0!important;top:0!important}}@page{size:1280px 720px;margin:0}html,body{margin:0;padding:0;background:#fff}.slide{break-after:page;break-inside:avoid;margin:0!important;box-shadow:none!important}.slide:last-child{break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><main class="canvas-host"><article class="slide design page-02" data-slide="02"><header class="slide-header"><div class="section-label">01. 문제</div><div class="header-brand">EONU<span>CARE COMMUNICATION</span></div></header><div class="heading"><h1>환자는 왔지만, <em>이야기는 오지 못했습니다.</em></h1><p>혼자 진료받는 아이와, 곁에 있지 못한 보호자.</p></div><div class="problem-grid"><div class="placeholder problem-media"><span>혼자 진료받는 아이 · 설명용 사례 장면</span></div><div class="problem-panel"><span class="micro cyan">진료실 안과 밖</span><h2>질문은 구체적인데,<br>관찰은 곁에 없습니다.</h2><div class="dialogue"><span>아이</span><p>언제부터 달라졌는지<br>설명하기 어려워요.</p></div><div class="dialogue"><span>보호자</span><p>집에서의 변화를<br>전하고 싶어요.</p></div><div class="dialogue"><span>의료진</span><p>필요한 정보를<br>짧은 시간에 확인해야 합니다.</p></div></div></div><div class="takeaway "><span class="band-mark">↗</span>동행의 부재가 만드는 정보 전달의 공백</div><footer class="slide-footer">설명을 위해 재구성한 사례<span class="page-number">02</span></footer></article></main><script>(()=>{const el=document.querySelector('.canvas-host');function fit(){const z=Math.min(innerWidth/1280,innerHeight/720);el.style.transform='scale('+z+')';el.style.left=((innerWidth-1280*z)/2)+'px';el.style.top=((innerHeight-720*z)/2)+'px';}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(parent!==window){parent.postMessage({type:'eonu-key',key:e.key},'*');if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault()}})})();</script></body></html>

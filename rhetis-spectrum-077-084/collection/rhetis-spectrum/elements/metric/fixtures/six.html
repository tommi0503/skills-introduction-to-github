<div class="stats" data-el="rhetis-spectrum-metric" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="stat" data-el="rhetis-spectrum-metric"><div class="parts"><p class="fig">32<small>%</small></p><p class="name">고객의 목소리</p><p class="note">고객의 실제 사용 맥락에서 다음 기회를 발견합니다.</p></div></div><div class="stat" data-el="rhetis-spectrum-metric"><div class="parts"><p class="fig">95<small>%</small></p><p class="name">제품 경험 개선</p><p class="note">작은 불편을 먼저 해결해 일관된 경험을 제공합니다.</p></div></div><div class="stat" data-el="rhetis-spectrum-metric"><div class="parts"><p class="fig">128<small>억</small></p><p class="name">데이터 기반 실행</p><p class="note">가설을 검증하고 결과를 다음 실행에 반영합니다.</p></div></div><div class="stat" data-el="rhetis-spectrum-metric"><div class="parts"><p class="fig">24<small>개</small></p><p class="name">운영 체계 고도화</p><p class="note">책임과 역할을 명확히 정해 협업의 속도를 높입니다.</p></div></div><div class="stat" data-el="rhetis-spectrum-metric"><div class="parts"><p class="fig">68<small>%</small></p><p class="name">지속 가능한 성장</p><p class="note">핵심 지표를 함께 살피고 성장을 이어갑니다.</p></div></div><div class="stat" data-el="rhetis-spectrum-metric"><div class="parts"><p class="fig">3<small>배</small></p><p class="name">성과 공유</p><p class="note">팀의 배움을 공유하고 더 나은 기준을 만듭니다.</p></div></div></div>

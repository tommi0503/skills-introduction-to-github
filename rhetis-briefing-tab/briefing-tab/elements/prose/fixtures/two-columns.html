<div class="prose cols" data-el="briefing-tab-prose" style="grid-column:1 / span 12; grid-row:1 / span 6"><p>온보딩의 목적은 새로운 동료가 회사의 방향과 업무 방식을 이해하고, 스스로 다음 행동을 결정할 수 있도록 돕는 것입니다.</p><p>첫 주에는 <b>팀의 목표와 고객의 문제</b>를 살펴봅니다. 담당 멘토와 정기적으로 대화하며 필요한 정보와 도움을 확인합니다.</p><p>업무 기록은 다음 사람의 출발점입니다. 결정한 이유와 실행 결과를 함께 남기면 같은 질문을 반복하는 시간을 줄일 수 있습니다.</p><p>첫 달이 끝나면 배운 점과 개선할 점을 돌아봅니다. 작은 실행에서 얻은 피드백을 다음 목표에 반영합니다.</p></div>

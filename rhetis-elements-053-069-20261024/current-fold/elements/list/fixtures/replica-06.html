<div class="list" data-el="current-fold-list" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="item"><span class="mark"><span class="icon" data-icon="settings"></span></span><p class="name">예약 배분안</p><p class="note">거점별 회수함의 온도와 배차 차례를 함께 대조하여<br>수거 지연이 있던 구간의 냉장 운송 순서를 조정합니다.</p></div><div class="item"><span class="mark"><span class="icon" data-icon="user-round"></span></span><p class="name">야간 운송안</p><p class="note">회수함마다 남긴 온도 기록과 야간 운행 이력을 모아<br>거점의 검수 차례와 다음 배차 간격을 정비합니다.</p></div><div class="item"><span class="mark"><span class="icon" data-icon="star"></span></span><p class="name">포장 자재안</p><p class="note">각 권역에서 회수한 용기의 품질과 적재 여유를 살피고<br>냉장 차량이 어느 거점에 머무를지 하루 전에 배정합니다.</p></div><div class="item"><span class="mark"><span class="icon" data-icon="target"></span></span><p class="name">창고 출입안</p><p class="note">물류팀 접수 창구의 간격을 살피며<br>예약 좌석의 배정 절차를 정돈합니다.</p></div></div>

<div class="prose cols" data-el="scanline-rise-prose" style="grid-column:1 / span 12; grid-row:1 / span 6"><p>흡착제 포화도를 살펴 냉매 재생 주기를 재산정한다. <b>누수 차단 기준</b></p><p>출하용 보냉함의 결로 흔적을 찾아 패킹 부품을 교환한다.</p><p>외기 유입구의 차압 기록으로 필터 교환 시점을 정한다.</p><p>축열 탱크의 야간 운전량을 나눠 피크 시간의 전력 부담을 줄인다.</p></div>

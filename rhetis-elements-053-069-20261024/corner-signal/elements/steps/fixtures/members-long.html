<div class="steps" data-el="corner-signal-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">구간 01</span><p class="name">출고 검수 <br>배차 조정</p><p class="note">출고 전 품온과 <br>수량을 확인합니다. <br>이상이 있으면 <br>배차를 바꾸고 <br>화주에게 알립니다.</p></div><div class="step"><span class="mark">구간 02</span><p class="name">도착 기록 <br>인수 확인</p><p class="note">거점별 도착 시각과 <br>품온을 기록합니다. <br>늦은 화물은 인수 담당자와 <br>함께 확인합니다.</p></div><div class="step"><span class="mark">구간 03</span><p class="name">회수품 검수 <br>재고 정리</p><p class="note">회수한 용기는 <br>오염과 파손을 점검합니다. <br>세척 기록을 남기고 <br>다시 쓸 수 있는 용기만 <br>창고에 넣습니다.</p></div></div>

<!-- min: 12x6 -->
<div class="flowchart" style="grid-column:1 / span 12; grid-row:1 / span 6" data-el="report-forge-flowchart">
  <div class="node start to-r" style="grid-column:1; grid-row:1"><b class="name">문의 접수</b></div>
  <div class="node to-r" style="grid-column:2; grid-row:1"><b class="name">요건 확인</b></div>
  <div class="node ask to-r to-d" style="grid-column:3; grid-row:1"><b class="name">예산 승인?</b></div>
  <div class="node end" style="grid-column:4; grid-row:1"><b class="name">계약 체결</b></div>
  <div class="node to-l" style="grid-column:3; grid-row:2"><b class="name">견적 조정</b></div>
  <div class="node to-u" style="grid-column:2; grid-row:2"><b class="name">담당자 재협의</b></div>
</div>

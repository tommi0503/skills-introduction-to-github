2><div class="frame"><section class="slide "><div class="page"><div class="body"><div class="prose " data-el="scanline-rise-prose" style="grid-column:1 / span 12; grid-row:1 / span 6;"><p>사용자 행동 분석을 통해 콘텐츠 탐색 과정의 병목을 확인했습니다. 핵심 콘텐츠에 도달하는 경로를 정비하고, 추천 기준을 실제 이용 패턴에 맞추어 조정합니다.</p><p><b>실험과 검증을 반복하는 운영 체계</b>로 분기별 실행 품질과 성과의 일관성을 높입니다.</p></div></div></div></section></div></article><article><h2>example-2</h2><div class="frame"><section class="slide "><div class="page"><div class="body"><div class="prose cols" data-el="scanline-rise-prose" style="grid-column:1 / span 12; grid-row:1 / span 6;"><p>올해는 신규 유입 고객의 초기 소비 경험 개선을 우선했습니다. 첫 화면 큐레이션을 정비하고, 커뮤니티 참여를 유도하는 기능을 단계적으로 적용했습니다.</p><p>차년도에는 성장 기반을 확장하며 전환율, 유지율, 콘텐츠 품질을 함께 관리합니다.</p></div></div></div></section></div></article></body></html>

<!-- min: 10x5 -->
<div class="swimlane" data-el="nocturne-swimlane" style="grid-column:1 / span 12; grid-row:1 / span 6; --cols:4">
  <div class="lane" style="grid-row:1"><b class="name">영업팀</b></div>
  <div class="lane" style="grid-row:2"><b class="name">생산팀</b></div>
  <div class="lane" style="grid-row:3"><b class="name">물류팀</b></div>
  <div class="node start to-d" style="grid-column:1; grid-row:1"><b class="name">주문 접수</b></div>
  <div class="node to-r" style="grid-column:1; grid-row:2"><b class="name">생산 계획</b></div>
  <div class="node ask to-r" style="grid-column:2; grid-row:2"><b class="name">자재 충분?</b></div>
  <div class="node to-d" style="grid-column:3; grid-row:2"><b class="name">조립·검사</b></div>
  <div class="node to-r" style="grid-column:3; grid-row:3"><b class="name">포장</b></div>
  <div class="node end" style="grid-column:4; grid-row:3"><b class="name">출하 완료</b></div>
</div>

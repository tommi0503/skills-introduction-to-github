<!-- min: 6x2 -->
<div class="flowchart" data-el="amethyst-flowchart" style="grid-column:1 / span 12; grid-row:1 / span 6">
<div class="node start to-r" style="grid-column:1; grid-row:1"><b class="name">고객 이해</b></div>
<div class="node to-r" style="grid-column:2; grid-row:1"><b class="name">서비스 설계</b></div>
<div class="node ask to-r to-d" style="grid-column:3; grid-row:1"><b class="name">제품 검증</b></div>
<div class="node end" style="grid-column:4; grid-row:1"><b class="name">시장 확장</b></div>
<div class="node to-l" style="grid-column:3; grid-row:2"><b class="name">운영 개선</b></div>
<div class="node to-u" style="grid-column:2; grid-row:2"><b class="name">고객 지원</b></div>
</div>

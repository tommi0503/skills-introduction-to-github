<!-- min: 6x3 -->
<div class="flowchart" data-el="vectorbox-flowchart" style="grid-column:1 / span 12; grid-row:1 / span 6;">
  <div class="node start to-r" style="grid-column:1; grid-row:1"><b class="name">신규 매장 실험</b></div>
  <div class="node to-r" style="grid-column:2; grid-row:1"><b class="name">교육 이력 연동</b></div>
  <div class="node ask to-r to-d" style="grid-column:3; grid-row:1"><b class="name">채권 회수 점검</b></div>
  <div class="node end" style="grid-column:4; grid-row:1"><b class="name">납기 위험 탐지</b></div>
  <div class="node to-l" style="grid-column:3; grid-row:2"><b class="name">원가 배분 개선</b></div>
  <div class="node to-u" style="grid-column:2; grid-row:2"><b class="name">권한별 승인</b></div>
</div>

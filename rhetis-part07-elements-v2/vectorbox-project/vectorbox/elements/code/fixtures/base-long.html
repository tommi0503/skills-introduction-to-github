<div class="code numbered" data-el="vectorbox-code" style="grid-column:1 / span 12; grid-row:1 / span 6;"><b class="name">납품 오차 축소</b><div class="lines"><p><span class="k">SELECT</span> branch,</p><p>       <span class="k">SUM</span>(settlement) <span class="k">AS</span> total,</p><p>       <span class="k">AVG</span>(delay) <span class="k">AS</span> delay</p><p><span class="k">FROM</span> invoices</p><p><span class="k">WHERE</span> year = <span class="n">2027</span></p><p>  <span class="k">AND</span> status = <span class="s">'OPEN'</span></p><p><span class="k">GROUP BY</span> branch</p><p><span class="k">ORDER BY</span> total <span class="k">DESC</span>;</p><p><span class="c">-- 지점별 정산 금액과 대기 일수</span></p></div></div>

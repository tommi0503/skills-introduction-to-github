<div class="prose" style="grid-column:1 / span 12; grid-row:1 / span 6" data-el="confetti-prose"><p>도입은 네 단계로 진행합니다. 먼저 2주 동안 현재 업무 흐름과 병목을 살펴보고, 개선할 지점을 담당자와 함께 정합니다.</p><p>다음으로 한 팀을 골라 4주 동안 시범 운영합니다. 이 기간에는 <b>기존 도구와 새 작업 공간을 함께</b> 쓰면서 지표를 비교합니다.</p><p>시범 운영 결과가 목표에 닿으면 부서 단위로 확대합니다. 교육과 데이터 이관은 전담 매니저가 맡습니다.</p><p>마지막으로 분기마다 사용 지표를 함께 점검하고, 필요한 기능을 다음 개선 계획에 반영합니다.</p></div>

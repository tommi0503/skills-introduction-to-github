<!-- min: 6x3 -->
<div class="swimlane" style="grid-column:1 / span 12; grid-row:1 / span 6; --cols:3" data-el="confetti-swimlane">
  <div class="lane" style="grid-row:1"><b class="name">신청자</b></div>
  <div class="lane" style="grid-row:2"><b class="name">팀장</b></div>
  <div class="node start to-d" style="grid-column:1; grid-row:1"><b class="name">휴가 신청</b></div>
  <div class="node ask to-r" style="grid-column:1; grid-row:2"><b class="name">일정 확인</b></div>
  <div class="node to-u" style="grid-column:2; grid-row:2"><b class="name">승인</b></div>
  <div class="node end" style="grid-column:2; grid-row:1"><b class="name">휴가 확정</b></div>
</div>

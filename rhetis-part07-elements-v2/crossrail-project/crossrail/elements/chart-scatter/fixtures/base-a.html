<!-- min:6x3 -->
<div class="scatter bubble" data-el="crossrail-chart-scatter" style="grid-column:1 / span 12;grid-row:1 / span 6;--xmax:100;--ymax:100">
  <span class="axis-x"><span>반출</span></span><span class="axis-y"><span>정비</span></span>
  <span class="dot" style="--x:20;--y:30;--r:40"><span>반출</span></span><span class="dot tone-2" style="--x:45;--y:60;--r:60"><span>정비</span></span>
  <span class="dot tone-3" style="--x:70;--y:40;--r:30"><span>반출</span></span><span class="dot on" style="--x:82;--y:78;--r:90"><span>정비</span></span>
  <span class="dot tone-4" style="--x:30;--y:80;--r:20"><span>반출</span></span>
</div>

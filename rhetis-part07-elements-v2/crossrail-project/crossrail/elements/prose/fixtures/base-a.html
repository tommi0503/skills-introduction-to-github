<div class="prose cols" data-el="crossrail-prose" style="grid-column:1 / span 12;grid-row:1 / span 6"><p>분해 후 남은 자재의 수량을 다시 세어 출고 담당자가 인수 대장에 서명합니다.</p><p>도착한 포장물을 운송장 번호와 맞춘 뒤 선반별 접수 대장에 남깁니다.</p><p>회수 차량의 잔여 운행 거리를 살펴 가장 가까운 정비실부터 방문 순서를 정합니다.</p><p>파손 신고가 들어오면 봉인 사진과 인수 시각을 함께 보관해 수리실로 전달합니다.</p></div>

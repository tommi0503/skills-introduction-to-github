  <div class="lane" style="grid-row:2"><b class="name">반출</b></div>
  <div class="lane" style="grid-row:3"><b class="name">정비</b></div>
  <div class="node start to-d" style="grid-column:1;grid-row:1"><b class="name">반품 인수</b></div>
  <div class="node to-r" style="grid-column:1;grid-row:2"><b class="name">수리 접수</b></div>
  <div class="node ask to-r" style="grid-column:2;grid-row:2"><b class="name">반품 인수</b></div>

<div class="steps " data-el="crossrail-steps" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="step"><span class="mark">01</span><p class="name">물량 분류</p><p class="note">반품 봉투를 도착 구역별로 나누고 회수 차량에 싣기 전 수량을 대조합니다.</p></div><div class="step"><span class="mark">02</span><p class="name">담당 배차</p><p class="note">기사별 잔여 운행 거리를 살펴 가장 가까운 회수 지점부터 순번을 지정합니다.</p></div><div class="step"><span class="mark">03</span><p class="name">수령 확인</p><p class="note">봉인 상태를 확인한 뒤 접수 번호와 서명 기록을 묶어 보관합니다.</p></div></div>

<!-- min:6x3 -->
<div class="flowchart" data-el="crossrail-flowchart" style="grid-column:1 / span 12;grid-row:1 / span 6">
  <div class="node start to-r" style="grid-column:1;grid-row:1"><b class="name">반품 인수</b></div>
  <div class="node to-r" style="grid-column:2;grid-row:1"><b class="name">수리 접수</b></div>
  <div class="node ask to-r to-d" style="grid-column:3;grid-row:1"><b class="name">반품 인수</b></div>
  <div class="node end" style="grid-column:4;grid-row:1"><b class="name">정비</b></div>
  <div class="node to-l" style="grid-column:3;grid-row:2"><b class="name">분실 물품 회수</b></div>
  <div class="node to-u" style="grid-column:2;grid-row:2"><b class="name">긴급 수리 접수</b></div>
</div>

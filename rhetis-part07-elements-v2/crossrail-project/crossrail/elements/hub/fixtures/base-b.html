<!-- min:10x6 -->
<div class="hub" data-el="crossrail-hub" style="grid-column:1 / span 12;grid-row:1 / span 6">
  <div class="core"><span class="icon" data-icon="clipboard-check"></span></div>
  <div class="spoke"><span class="mark"><span class="icon" data-icon="package-check"></span></span><b class="name">운송장 확인</b><p class="note">입고 순번을 확인한 뒤 담당 선반에 둡니다.</p></div>
  <div class="spoke"><span class="mark"><span class="icon" data-icon="package-check"></span></span><b class="name">배차</b><p class="note">반출 요청 건은 운송장별로 모아 둡니다.</p></div>
  <div class="spoke"><span class="mark"><span class="icon" data-icon="package-check"></span></span><b class="name">정비</b><p class="note">봉인 상태를 살펴 파손 건만 따로 맡깁니다.</p></div>
  <div class="spoke on"><span class="mark"><span class="icon" data-icon="package-check"></span></span><b class="name">회수</b><p class="note">회수 차량은 담당 창고 앞에서 순번을 받습니다.</p></div>
  <div class="spoke"><span class="mark"><span class="icon" data-icon="package-check"></span></span><b class="name">보관</b><p class="note">담당 기사가 출발 전에 수량을 대조합니다.</p></div>
  <div class="spoke"><span class="mark"><span class="icon" data-icon="package-check"></span></span><b class="name">반출</b><p class="note">보관 기한이 지난 물품은 별도로 알립니다.</p></div>
</div>

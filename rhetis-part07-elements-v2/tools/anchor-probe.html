<!doctype html><html><style>html,body{margin:0;background:white}.plot{position:relative;margin:80px;width:600px;height:240px;container-type:size;--max:100;--n:6;background:#eee;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}.pt{position:static;grid-column:var(--i);grid-row:1;justify-self:center;align-self:start;margin-top:calc(100cqh*(1 - var(--v)/var(--max)));width:0;height:0}.pt::after{content:"";position:absolute;left:calc(anchor(var(--self) center) - 4px);top:calc(anchor(var(--self) center) - 4px);width:8px;height:8px;border-radius:50%;background:#1461b0}.pt::before{content:"";position:absolute;left:anchor(var(--prev) center);right:anchor(var(--self) center);top:calc(anchor(var(--prev) center) - 100cqh);bottom:0;background:#1461b0;clip-path:polygon(0 100cqh,100% calc(100% - 100cqh*var(--v)/var(--max)),100% calc(100% - 100cqh*var(--v)/var(--max) + 2px),0 calc(100cqh + 2px))}.pt:first-child::before{display:none}.pt:nth-child(1){--i:1;--self:--p1;anchor-name:--p1;--prev:--p0}.pt:nth-child(2){--i:2;--self:--p2;anchor-name:--p2;--prev:--p1}.pt:nth-child(3){--i:3;--self:--p3;anchor-name:--p3;--prev:--p2}.pt:nth-child(4){--i:4;--self:--p4;anchor-name:--p4;--prev:--p3}.pt:nth-child(5){--i:5;--self:--p5;anchor-name:--p5;--prev:--p4}.pt:nth-child(6){--i:6;--self:--p6;anchor-name:--p6;--prev:--p5}</style><div class="plot"><div class="pt" style="--v:30"></div><div class="pt" style="--v:55"></div><div class="pt" style="--v:55"></div><div class="pt" style="--v:20"></div><div class="pt" style="--v:80"></div><div class="pt" style="--v:45"></div></div></html>

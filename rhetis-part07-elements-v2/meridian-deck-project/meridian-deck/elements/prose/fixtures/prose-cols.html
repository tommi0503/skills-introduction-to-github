<div class="prose cols" data-el="meridian-deck-prose" style="grid-column:1 / span 12; grid-row:1 / span 6"><p>제조 부문은 자동화 설비 도입으로 생산성을 21% 높였습니다. 핵심 부품의 자체 생산 비중도 70%까지 올라 원가 경쟁력이 커졌습니다.</p><p>유통 부문은 온라인 채널 매출이 처음으로 오프라인을 넘었습니다. 물류 거점을 두 곳 늘려 배송 기간을 하루 줄였습니다.</p><p>서비스 부문은 유지 보수 계약이 3,200건으로 늘며 안정적인 반복 매출을 만들었습니다.</p><p>해외 법인은 동남아 두 곳이 처음으로 흑자로 돌아섰고 내년에는 매출 비중 20%를 목표로 합니다.</p></div>

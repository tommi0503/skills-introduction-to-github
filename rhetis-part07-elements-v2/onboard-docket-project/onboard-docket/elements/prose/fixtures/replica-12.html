<div class="prose quiet" data-el="onboard-docket-prose" style="grid-column:1 / span 12;grid-row:1 / span 6"><p>담당 조직은 지난 분기 접수 기록을 대조하며 처리 기한이 지연된 원인을 분류했습니다. 안내 문구와 승인 절차가 서로 다른 구간은 같은 기준으로 정비합니다.<br><br>이번 배포에서는 이관 담당자가 변경 사유를 확인할 수 있도록 승인 내역과 근거 문서를 연결합니다. 예외 요청은 별도 기록해 다음 점검에서 처리 경과를 다시 살핍니다.<br>운영 책임자는 현장의 질문을 모아 담당자 협의 결과와 함께 공유합니다.</p></div>

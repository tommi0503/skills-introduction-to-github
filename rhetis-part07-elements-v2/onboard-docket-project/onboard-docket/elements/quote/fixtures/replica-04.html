<div class="quote" data-el="onboard-docket-quote" style="grid-column:1 / span 12;grid-row:1 / span 6"><blockquote><p>현장의 의견과 운영 경험을 연결해<br><span class="hl" data-el="onboard-docket-tag">합의한 운영 기준을 문서로 남깁니다.</span></p><p>운영 담당자는 최근 접수된 문의를 채널별로 분류하고 처리 소요 시간을 대조했습니다. 검토 결과 반복 발생 항목에 인력을 우선 배정하기로 합의했습니다. 다음 배포에서는 승인 내역과 변경 사유를 기록해 인수 담당자가 이력을 확인할 수 있도록 합니다.</p></blockquote><div class="by"><p class="name">운영총괄　<span>윤　서　진</span></p></div></div>

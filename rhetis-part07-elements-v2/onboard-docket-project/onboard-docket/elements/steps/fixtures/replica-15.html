<!-- min: 6x3 -->
<div class="steps" data-el="onboard-docket-steps" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="step"><div class="mark"><span class="icon" data-icon="handshake"></span></div><p class="name">검토 범위 확정</p><p class="note">접수 채널별 장애를 나누고<br>반복 문의의 원인을 확인해<br>우선 개선할 항목을 정한 뒤<br>담당 조직과 범위를 맞춥니다.</p></div><div class="step"><div class="mark"><span class="icon" data-icon="lightbulb"></span></div><p class="name">현장 의견 수집</p><p class="note">현장 상담의 이력을 살피고<br>검토할 요청을 함께 묶어<br>이번 분기의 승인 조건을<br>운영 책임자와 협의합니다.</p></div><div class="step"><div class="mark"><span class="icon" data-icon="chart-column"></span></div><p class="name">실행 항목 승인</p><p class="note">이관 근거와 예산을 대조해<br>승인된 항목부터 적용한 뒤<br>예외 요청의 처리 사유를<br>담당 조직에 공유합니다.</p></div><div class="step"><div class="mark"><span class="icon" data-icon="rocket"></span></div><p class="name">후속 성과 확인</p><p class="note">운영 지표와 조치 결과를<br>접수 기록과 다시 대조해<br>후속 점검의 담당자를 정하고<br>다음 배포의 범위를 정합니다.</p></div></div>

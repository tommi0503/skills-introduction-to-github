<div class="steps col" data-el="onboard-docket-steps" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="step"><div class="mark">검토 1</div><p class="name">검토 범위 확정</p><p class="note">지난 분기 접수된 장애 사례를 유형별로 분류하고 담당 부서의 개선 의견을 취합합니다.</p></div><div class="step"><div class="mark">검토 2</div><p class="name">현장 의견 수집</p><p class="note">현장 인터뷰에서 확인한 불편을 우선순위로 묶어 이번 배포 범위에 반영합니다.</p></div><div class="step"><div class="mark">검토 3</div><p class="name">실행 항목 승인</p><p class="note">예산 검토와 담당자 합의를 거쳐 승인된 항목부터 순차적으로 운영에 적용합니다.</p></div></div>

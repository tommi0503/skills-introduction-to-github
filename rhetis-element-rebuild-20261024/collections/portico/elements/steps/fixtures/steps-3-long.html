<div class="steps" data-el="portico-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">01</span><b class="name">발주 수량과 반입 조건을 함께 정합니다</b><p class="note">물건을 받을 장소와 담당자를 확인하고 한 번에 실을 수량을 맞춥니다.</p></div><div class="step"><span class="mark">02</span><b class="name">창고에서 품목별로 물건을 모읍니다</b><p class="note">주문 전표에 맞춰 규격과 묶음 수량을 대조한 뒤 포장 순서를 정합니다.</p></div><div class="step"><span class="mark">03</span><b class="name">지정 시간에 차량으로 전달합니다</b><p class="note">매장별 반입 시각을 확인하며 물건을 인계하고 전표 서명을 받습니다.</p></div></div>

<div class="steps" data-el="tide-tab-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">01</span><p class="name">지점별 발주량을 모읍니다</p><p class="note">남은 물건과 판매 일정을 살펴 이번 주에 받을 품목을 정합니다.</p></div><div class="step"><span class="mark">02</span><p class="name">거래처와 납품일을 맞춥니다</p><p class="note">차량에 실을 수량과 반입 장소를 확인하고 담당자에게 알립니다.</p></div><div class="step"><span class="mark">03</span><p class="name">도착한 물건을 검수합니다</p><p class="note">발주서의 규격과 수량을 대조하고 차이가 난 항목을 적습니다.</p></div></div>

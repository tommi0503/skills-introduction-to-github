<div class="steps col" data-el="tide-tab-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">01</span><p class="name">입고할 물건과 반입 시간을 확인합니다</p><p class="note">발주서를 펼쳐 품목별 수량과 담당자의 연락처를 적습니다.</p></div><div class="step"><span class="mark">02</span><p class="name">받은 물건을 구역별로 나누어 놓습니다</p><p class="note">포장 상태를 살핀 다음 장부의 보관 위치를 고칩니다.</p></div><div class="step"><span class="mark">03</span><p class="name">매장으로 보낼 수량을 다시 셉니다</p><p class="note">배송 차량에 실을 묶음마다 납품처와 출고 날짜를 붙입니다.</p></div></div>

<div class="hub" data-el="tide-tab-hub" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="core"><b>매장<br>재고율</b><small>입출고 현황 점검</small><small>각 점포의 재고를 모아<br>발주량을 조절합니다.</small><span class="icon" data-icon="handshake"></span><span class="icon" data-icon="chart-pie"></span></div><div class="spoke"><span class="mark"><span class="icon" data-icon="chart-no-axes-combined"></span></span><p class="name">매장재고연동</p><p class="note">지점별 남은 상품을 합쳐 확인하고 주문 승인 전에 부족분을 알립니다.</p></div><div class="spoke"><span class="mark"><span class="icon" data-icon="cup-soda"></span></span><p class="name">배송일정계산</p><p class="note">차량별 적재량과 도로 혼잡을 반영하여 도착 예정 시각을 계산합니다.</p></div><div class="spoke"><span class="mark"><span class="icon" data-icon="presentation"></span></span><p class="name">거래명세정리</p><p class="note">계약서와 발송 이력의 수량을 맞춰 잘못 청구된 항목을 골라냅니다.</p></div><div class="spoke"><span class="mark"><span class="icon" data-icon="package-check"></span></span><p class="name">정산오류탐지</p><p class="note">원장에 남은 금액과 입금 내역의 차이를 분류하여 마감 담당자에게 보냅니다.</p></div></div>

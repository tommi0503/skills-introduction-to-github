<div class="hub" data-el="tide-tab-hub" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="core"><b>현장<br>가동률</b><small>운영 기준을 한곳에</small><small>장비의 멈춘 시간을 줄여<br>작업 시간을 확보합니다.</small><span class="icon" data-icon="handshake"></span><span class="icon" data-icon="chart-pie"></span></div><div class="spoke"><span class="mark"><span class="icon" data-icon="chart-no-axes-combined"></span></span><p class="name">설비 정지<b>01</b></p><p class="note">지난주 기록을 모아<br>고장 원인을 나누고<br>교체가 필요한 부품을<br>미리 확보합니다.</p></div><div class="spoke"><span class="mark"><span class="icon" data-icon="cup-soda"></span></span><p class="name">불량 검사<b>02</b></p><p class="note">출고 전 표본을 뽑아<br>규격의 차이를 살피고<br>원자재 묶음별 편차를<br>따로 기록합니다.</p></div><div class="spoke"><span class="mark"><span class="icon" data-icon="presentation"></span></span><p class="name">자재 도착<b>03</b></p><p class="note">납품처의 잔여 물량과<br>차량의 도착 시각을<br>작업조별 배치 계획에<br>함께 반영합니다.</p></div></div>

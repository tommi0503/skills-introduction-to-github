<div class="steps" data-el="rulemark-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">구간 01</span><p class="name">주문 접수</p><div class="note"><b>반입 물량 확인</b><p>새로 들어온 주문을<br>품목별로 나누어<br>장부에 적습니다.</p></div></div><div class="step"><span class="mark">구간 02</span><p class="name">품목 검수</p><div class="note"><b>수량과 상태 대조</b><p>상자 안의 물건을<br>발주 내역과 비교해<br>차이를 남깁니다.</p></div></div><div class="step"><span class="mark">구간 03</span><p class="name">보관 배정</p><div class="note"><b>빈 공간의 지정</b><p>먼저 꺼낼 품목은<br>출입구 가까이에<br>따로 모아 둡니다.</p></div></div><div class="step"><span class="mark">구간 04</span><p class="name">운송 준비</p><div class="note"><b>차량별 묶음 편성</b><p>도착할 장소별로<br>보낼 물건을 묶어<br>순서를 정합니다.</p></div></div><div class="step"><span class="mark">구간 05</span><p class="name">인수 확인</p><div class="note"><b>수령 내역의 회신</b><p>거래처가 받은 수량과<br>남은 포장재를 적어<br>다음 주문에 씁니다.</p></div></div></div>

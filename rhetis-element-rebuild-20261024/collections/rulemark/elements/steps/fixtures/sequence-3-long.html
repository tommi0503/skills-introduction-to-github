<div class="steps" data-el="rulemark-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">구간 01</span><p class="name">입고 기록의 대조</p><div class="note"><b>납품서에 없는 품목 분리</b><p>차량에서 내린 자재를 발주서와 하나씩 비교하고 이름이 다른 물건은 따로 모아 담당자에게 물어봅니다.</p></div></div><div class="step"><span class="mark">구간 02</span><p class="name">보관 환경의 확인</p><div class="note"><b>냉장 구역별 온도의 기록</b><p>창고의 표시 온도를 오전과 오후에 나누어 적고 차이가 큰 구역은 물건을 옮기기 전에 다시 살핍니다.</p></div></div><div class="step"><span class="mark">구간 03</span><p class="name">회수 날짜의 협의</p><div class="note"><b>거래처별 반품 수량의 확인</b><p>다시 가져갈 물건을 매장별로 모으고 빈 상자와 파손된 품목을 나누어 차량에 실을 순서를 정합니다.</p></div></div></div>

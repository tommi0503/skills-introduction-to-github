<div class="agenda" data-el="toggle-grid-agenda" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="entry"><span class="mark">01</span><p class="name">접수 경로의 통합</p><p class="note">나뉜 창구의 문의를 공통 항목으로 모으고 담당 부서가 처리 결과를 함께 점검합니다.</p></div><div class="entry on"><span class="mark">02</span><p class="name">거점 수요의 확인</p><p class="note">지역마다 달랐던 운영 조건을 비교해 먼저 실행할 개선 과제와 책임 부서를 정했습니다.</p></div><div class="entry"><span class="mark">03</span><p class="name">현장 대응의 개선</p><p class="note">반복되는 요청의 원인을 찾아 안내 기준에 담고 다음 점검에서 실제 변화를 확인합니다.</p></div><div class="entry"><span class="mark">04</span><p class="name">협력 기준의 정리</p><p class="note">지원 조직이 같은 기록을 살피며 실행 일정과 필요한 자원을 함께 정합니다.</p></div></div>

<div class="steps" data-el="toggle-grid-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">1</span><b class="name">매장별 발주를 모읍니다</b><p class="note">품목 규격과 주문 수량을 확인한 뒤 같은 날 받을 물량을 함께 정리합니다.</p></div><div class="step"><span class="mark">2</span><b class="name">창고 반입을 맞춥니다</b><p class="note">보관 구역과 차량 진입 조건을 살펴 담당자에게 인계할 순서를 전달합니다.</p></div><div class="step"><span class="mark">3</span><b class="name">물품 수량을 대조합니다</b><p class="note">받은 물건과 전표를 함께 살피고 다음 발주에 반영할 내용을 기록합니다.</p></div></div>

<div class="code numbered" data-el="filament-code" style="grid-column:1 / span 12; grid-row:1 / span 6"><p class="name">거점별 납기 점검용 묶음 조회.sql</p><div class="lines"><p><span class="c">-- 운송 묶음별 실적 조회</span></p><p><span class="k">SELECT</span></p><p>  hub_key,</p><p>  SUM(box_qty) <span class="k">AS</span> packed_qty,</p><p>  AVG(lag_h) <span class="k">AS</span> mean_lag</p><p><span class="k">FROM</span> cargo_day</p><p><span class="k">WHERE</span> day_key &gt;= <span class="s">'2098-04-01'</span></p><p>  <span class="k">AND</span> hub_key != <span class="s">'보류'</span></p><p><span class="k">GROUP BY</span> hub_key</p><p><span class="k">HAVING</span> SUM(box_qty) &gt; <span class="n">140</span></p><p><span class="k">ORDER BY</span> mean_lag <span class="k">ASC</span>;</p><p><span class="c">-- 평균 지연이 짧은 곳부터 점검</span></p></div></div>

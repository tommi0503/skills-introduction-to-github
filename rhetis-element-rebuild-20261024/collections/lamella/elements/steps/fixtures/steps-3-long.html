<div class="steps" data-el="lamella-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><b class="mark">01</b><span class="name">발주 수량 취합</span><p class="note">매장별 반입 약속과 보관 장소를 확인해 권역 물량을 모읍니다.</p></div><div class="step"><b class="mark">02</b><span class="name">공동 배차 조율</span><p class="note">적재 규격이 비슷한 품목을 묶고 차량별 경유 순서를 정합니다.</p></div><div class="step"><b class="mark">03</b><span class="name">현장 검수 인계</span><p class="note">검수 담당자가 수량과 외관을 확인하고 인수 기록을 남깁니다.</p></div></div>

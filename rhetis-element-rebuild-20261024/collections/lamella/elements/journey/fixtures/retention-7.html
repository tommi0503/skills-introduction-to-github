<div class="journey" data-el="lamella-journey" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="stage" style="--mood:55;--next:0"><b class="name">발견</b><p class="note">지점 안내에서 이용 조건을 찾아본다</p><p class="pain">조건 비교 번거로움</p></div><div class="stage on" style="--mood:0;--next:70"><b class="name">상담</b><p class="note">담당자에게 물량과 노선을 설명한다</p></div><div class="stage" style="--mood:70;--next:40"><b class="name">견적</b><p class="note">회차별 예상 금액과 기한을 대조한다</p></div><div class="stage" style="--mood:40;--next:100"><b class="name">신청</b><p class="note">필요 자료를 모아 접수 내용을 보낸다</p><p class="pain">추가 서류 재요청</p></div><div class="stage" style="--mood:100;--next:60"><b class="name">배정</b><p class="note">확정된 기사와 차량 정보를 받는다</p></div><div class="stage" style="--mood:60;--next:90"><b class="name">운행</b><p class="note">작업 현황과 변동 내용을 확인한다</p></div><div class="stage" style="--mood:90"><b class="name">정산</b><p class="note">완료 이력을 검토하고 다음 회차를 잡는다</p></div></div>

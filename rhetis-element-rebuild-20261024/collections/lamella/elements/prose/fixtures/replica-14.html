<div class="prose " data-el="lamella-prose" style="grid-column:1 / span 12;grid-row:1 / span 6"><p><b>현장 수요의 정기 확인</b>주요 거점의 문의를 모아<br>실제 이용 흐름과 비교하고<br>다음 실행 범위를 정합니다.</p><p><b>협력 조직의 대응 점검</b>담당자별 처리 현황을 살펴<br>도입 전에 필요한 준비와<br>지원 절차를 함께 맞춥니다.</p><p><b>작은 실험의 성과 공유</b>검증한 실행의 결과를 모아<br>운영 회의에서 근거를 밝히고<br>새로운 개선 과제에 씁니다.</p></div>

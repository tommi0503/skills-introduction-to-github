<div class="card on" data-el="lamella-card" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="parts"><h3 class="name">현장 지원 체계</h3><div class="note"><p><b>거점별 수요 확인</b><span>지난 분기의 상담 기록을 묶어 업종별 구매 주기와 예상 발주량을 다시 살폈습니다.</span></p><p><b>도입 부담 완화</b><span>기존 장비를 그대로 쓰는 연동 절차를 마련해 초기 준비 비용과 현장 대기 시간을 낮췄습니다.</span></p><p><b>반복 업무 개선</b><span>자주 생기는 오류부터 안내 방식을 바꾸고 담당 부서가 후속 결과를 함께 점검했습니다.</span></p><p><b>협력 부서 연계</b><span>문의 유형을 기준으로 지원 창구를 정리하고 진행 상황을 담당자에게 매일 전달했습니다.</span></p><p><b>운영 비용 검토</b><span>반복 투입되는 업무 시간을 살펴 조정 여지가 있는 항목부터 분기 예산에 반영했습니다.</span></p></div></div></div>

<!-- min: 8x3 -->
<div class="steps" data-el="cutfield-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">01</span><p class="name">접수 분류</p><p class="note">도착한 요청을 모아<br>담당 부서별로 나눈 뒤<br>처리 순서를 정합니다.</p></div><div class="step"><span class="mark">02</span><p class="name">현장 확인</p><p class="note">신청서에 없는 항목은<br>담당자에게 다시 물어<br>빈칸을 채워 둡니다.</p></div><div class="step"><span class="mark">03</span><p class="name">금액 산정</p><p class="note">자재와 인건비 내역을<br>서로 다른 항목으로<br>구분하여 계산합니다.</p></div><div class="step"><span class="mark">04</span><p class="name">일정 확정</p><p class="note">작업조의 남은 시간을<br>예약 목록과 대조해<br>방문 날짜를 고릅니다.</p></div></div>

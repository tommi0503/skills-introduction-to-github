<div class="pyramid" data-el="cutfield-pyramid" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="level"><p class="name">납품 계약에서 먼저 정할 운영 원칙</p><p class="note">매장에서 받을 물건과 반입 시간을 합의한 뒤 변경 요청을 받을 담당자를 정합니다.</p></div><div class="level"><p class="name">현장 담당자가 따를 정기 확인 절차</p><p class="note">도착한 수량과 포장 상태를 살피고 차이가 난 항목은 거래처에 다시 확인합니다.</p></div><div class="level"><p class="name">매일 남겨 둘 출고와 정산 기록</p><p class="note">차량별로 실은 묶음 수를 적고 납품처가 받은 수량을 대조하여 장부를 닫습니다.</p></div></div>

*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#ededf0}.slide{width:1280px;height:720px;position:relative;overflow:hidden;font-family:Pretendard,sans-serif;background:white;color:#17202b}.node{position:absolute;box-sizing:border-box}.text,.chip{font-family:Pretendard,sans-serif;margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:normal;-webkit-font-smoothing:antialiased}.text{display:flex;flex-direction:column;justify-content:flex-start}.chip{display:flex;align-items:center;justify-content:center;white-space:nowrap}.chip-label{display:inline-block;position:relative;line-height:1}.vector svg{width:100%;height:100%;display:block}.node .parts{width:100%;height:100%;display:contents}.node .name{font:inherit;color:inherit;line-height:inherit;letter-spacing:inherit;margin:0;white-space:inherit}.node .seat{width:100%;height:100%;background:#e5e5e5;border-radius:inherit}.node .seat::after{content:none!important}@page{size:1280px 720px;margin:0}@media print{html,body{background:white}.slide{break-after:page;page-break-after:always;print-color-adjust:exact;-webkit-print-color-adjust:exact}.slide:last-child{break-after:auto}}</style></head><body><section class="slide" data-deck="047" data-slide="slide_13" style="background:#1b2b5f"><div class="node text" data-node="0" data-kind="text" style="left:91px;top:219px;width:800px;height:65px;font-family:Pretendard;font-size:44px;font-weight:400;line-height:1.3;letter-spacing:0px;color:#4c9cfe;text-align:left;justify-content:flex-start">04</div><div class="node text" data-node="1" data-kind="text" style="left:83px;top:286px;width:1100px;height:110px;font-family:Pretendard;font-size:88px;font-weight:500;line-height:1.15;letter-spacing:0px;color:#fff;text-align:left;justify-content:flex-start">실행계획</div><div class="node text" data-node="2" data-kind="text" style="left:91px;top:393px;width:1100px;height:45px;font-family:Pretendard;font-size:27px;font-weight:400;line-height:1.3;letter-spacing:0px;color:#fff;text-align:left;justify-content:flex-start">단계별 추진 일정</div></section><script>document.fonts.ready.then(()=>{for(const el of document.querySelectorAll('.chip')){const l=el.querySelector('[data-chip-label]');if(!l)continue;const s=getComputedStyle(el),c=document.createElement('canvas').getContext('2d');c.font=s.fontWeight+' '+s.fontSize+' '+s.fontFamily;const m=c.measureText(l.textContent);const dx=(m.actualBoundingBoxRight-m.actualBoundingBoxLeft-m.width)/2;const dy=(m.fontBoundingBoxAscent-m.fontBoundingBoxDescent+m.actualBoundingBoxDescent-m.actualBoundingBoxAscent)/2;l.style.transform='translate('+(-dx)+'px,'+(-dy)+'px)'}document.body.dataset.ready='true'})</script></body></html>

<div class="steps" data-el="halo-field-steps--rings" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="step"><span class="mark"><span class="digit">01.</span></span><p class="name">출고 점검</p><p class="note">배차표와 송장을 대조해<br>빠진 물량을 확인합니다.</p></div><div class="step"><span class="mark"><span class="digit">02.</span></span><p class="name">경로 조정</p><p class="note">야간 정체 구간을 피하고<br>도착 시간을 조율합니다.</p></div><div class="step"><span class="mark"><span class="digit">03.</span></span><p class="name">상차 검수</p><p class="note">용기 수량과 온도를 적고<br>운송 기사에게 인계합니다.</p></div><div class="step"><span class="mark"><span class="digit">04.</span></span><p class="name">도착 확인</p><p class="note">인수 서명을 대조하고<br>미도착 건을 점검합니다.</p></div><div class="step"><span class="mark"><span class="digit">05.</span></span><p class="name">회수 정리</p><p class="note">빈 용기의 세척 상태와<br>재사용 수량을 기록합니다.</p></div></div>

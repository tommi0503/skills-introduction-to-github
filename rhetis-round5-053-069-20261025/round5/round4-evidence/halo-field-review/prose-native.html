/* Page furniture and the fixed 1280 × 720 contract grid. Element roots are never selected here. */
.slide{position:relative;width:1280px;height:720px;overflow:hidden;box-sizing:border-box;background:var(--page);color:var(--ink);font-family:var(--font-body);font-weight:var(--body-weight);line-height:var(--body-line);letter-spacing:var(--body-track);container-type:size}

.slide>.page{position:relative;width:100%;height:100%;isolation:isolate}
.slide .body{position:absolute;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:var(--gap-sm);min-width:0;min-height:0}

.slide .head{position:absolute;z-index:2}.slide .head.center{text-align:center}
.slide .title{font-family:var(--font-display);font-weight:var(--title-weight);line-height:var(--title-line);letter-spacing:var(--title-track)}
.slide .title b{color:var(--a1-7);font-weight:var(--weight-display)}
.slide .kicker{font-size:var(--type-16);font-weight:var(--label-weight);line-height:var(--label-line);letter-spacing:var(--label-track);color:var(--a1-7)}
.slide .lead{font-size:var(--type-18);font-weight:var(--lead-weight);line-height:var(--lead-line);letter-spacing:var(--lead-track);color:var(--n-7)}
.slide .group{display:flex;gap:var(--gap-sm);min-width:0;min-height:0}.slide .group>*{flex:1;min-width:0;min-height:0}
.slide .group.col,.slide .stack{display:flex;flex-direction:column;gap:var(--gap-sm);min-width:0;min-height:0}.slide .stack>*{flex:1;min-width:0;min-height:0}
.slide .group.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.slide .group.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.slide .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--gap);min-width:0;min-height:0}.slide .split.wide-left{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

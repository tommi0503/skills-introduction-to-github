<div class="prose" data-el="cinder-pulse-prose" style="grid-column:1 / span 12;grid-row:1 / span 6"><p>반갑습니다, 냉장식품유통 총괄 박서윤입니다.<br><br>냉장유통팀은 2020년, 산지와 도심 사이에서 식품의 신선도를 지키겠다는 소박한 약속으로 배차를 시작했습니다. 지난 여섯 해 동안 운송 온도와 상차 순서를 꾸준히 개선하며,<br>이제는 전국 180여 개 협력 매장의 신선식품 정기 배송을 맡는 저온 운송 조직으로<br>자리잡았습니다.<br><br>출고량을 늘리기보다 예정한 시간과 온도를 지키는 것을 배차의 첫 기준으로 삼습니다.<br>출하 전 검수와 거점별 인계 기록을 함께 점검하며, 산지에서 매장까지 식품의 온도가 흔들리지 않도록 배차를 세심히 조율합니다.</p></div>

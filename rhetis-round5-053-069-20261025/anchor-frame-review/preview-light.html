/* Page furniture and the fixed 1280 × 720 contract grid. Element roots are never selected here. */
.slide{position:relative;width:1280px;height:720px;overflow:hidden;box-sizing:border-box;background:var(--page);color:var(--ink);font-family:var(--font-body);font-weight:var(--body-weight);line-height:var(--body-line);letter-spacing:var(--body-track);container-type:size}

.slide .head{position:absolute;z-index:2}.slide .head.center{text-align:center}
.slide .title{font-family:var(--font-display);font-weight:var(--title-weight);line-height:var(--title-line);letter-spacing:var(--title-track)}

.slide .lead{font-size:var(--type-18);font-weight:var(--lead-weight);line-height:var(--lead-line);letter-spacing:var(--lead-track);color:var(--n-7)}
.slide .group{display:flex;gap:var(--gap-sm);min-width:0;min-height:0}.slide .group>*{flex:1;min-width:0;min-height:0}

/* A stacked placement keeps its own picture ratio instead of flex-stretching into a strip. */

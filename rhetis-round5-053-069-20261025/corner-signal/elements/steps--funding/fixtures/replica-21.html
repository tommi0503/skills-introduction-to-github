<div class="steps" data-el="corner-signal-steps--funding"><div class="layout"><div class="geometry" aria-hidden="true"><span class="rule rule-1"></span><span class="facet facet-2"></span><span class="facet facet-3"></span><span class="rule rule-4"></span><span class="facet facet-5"></span><span class="facet facet-6"></span><span class="rule rule-7"></span><span class="facet facet-8"></span><span class="facet facet-9"></span><span class="rule rule-10"></span><span class="facet facet-11"></span><span class="facet facet-12"></span></div><span class="mark symbol-1"><span class="icon" data-icon="file-text"></span></span><span class="mark symbol-2"><span class="icon" data-icon="contact"></span></span><span class="mark symbol-3"><span class="icon" data-icon="network"></span></span><span class="mark symbol-4"><span class="icon" data-icon="flag"></span></span><div class="step"><p class="kick kick-1">01<br>투자 확보</p><p class="name name-1">저온 운송<br>전용 차량 확보</p><p class="note note-1">전용 차량을 확보하여 주요 권역의<br>야간 운송 간격을 줄입니다.</p></div><div class="step"><p class="kick kick-2">02<br>시설 확충</p><p class="name name-2">회수 거점<br>검수 설비 확충</p><p class="note note-2">회수함 검수 설비와 인력을 보강해<br>거점의 처리 여유를 넓힙니다.</p></div><div class="step"><p class="kick kick-3">03<br>권역 확장</p><p class="name name-3">신규 권역<br>거래처 확대</p><p class="note note-3">권역별 운행 노선을 연결하여<br>정기 거래처의 회수량을 늘립니다.</p></div><div class="step"><p class="kick kick-4">04<br>수익 개선</p><p class="name name-4">배송 품질<br>재사용률 개선</p><p class="note note-4">운송 온도와 회수 시간을 개선해<br>안정적인 반복 수익을 만듭니다.</p></div></div></div>

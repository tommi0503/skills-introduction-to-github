<div class="prose" data-el="corner-signal-prose--letter"><div class="layout"><div class="geometry" aria-hidden="true"><span class="face face-1"></span><span class="face face-2"></span><span class="facet facet-3"></span><span class="rule rule-4"></span></div><p class="name name-1">회수 거점이 함께 만드는 안정적인 물류</p><p class="note note-1">저는 회수 거점과 냉장 운송망의 연결을 책임지는 운영 총괄입니다.<br>운송 기록에서 검수 지연이 있던 구간과 원인을 함께 찾았습니다.<br>냉장 차량의 배차 간격과 현장의 적재 차례를 함께 조정하고,<br>회수한 용기가 다음 배송에 빠르게 쓰이도록 운행 기반을 넓힙니다.</p><p class="note note-2">현장과 배차팀이 같은 온도 이력과 검수 기록을 확인하며,<br>권역별 회수 시간을 조율하는 정기 운송 체계를 만들겠습니다.</p></div></div>

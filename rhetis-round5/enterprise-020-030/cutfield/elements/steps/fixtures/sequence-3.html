<div class="steps" data-el="cutfield-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">01</span><p class="name">입찰 공지</p><p class="note">구매할 품목을 정리해<br>여러 납품처에 같은<br>양식으로 안내합니다.</p></div><div class="step"><span class="mark">02</span><p class="name">조건 비교</p><p class="note">제출된 견적의 운송비와<br>보증 범위를 함께 읽고<br>차이를 적어 둡니다.</p></div><div class="step"><span class="mark">03</span><p class="name">계약 체결</p><p class="note">최종 수량을 확인하고<br>수령 장소와 기한을<br>양쪽 담당자가 정합니다.</p></div></div>

<div class="steps col" data-el="rulemark-steps" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="step"><span class="mark">구간 01</span><p class="name">계약 협의</p><div class="note"><b>발주 조건의 재확인</b><p>사용할 자재의 규격과 납품 기한을 확인하고 비용에 포함할 작업을 함께 정합니다.</p></div></div><div class="step"><span class="mark">구간 02</span><p class="name">공정 점검</p><div class="note"><b>진행 구간의 기록</b><p>작업을 마친 부분을 도면에 표시하고 다음 팀이 들어오기 전에 보완할 곳을 적습니다.</p></div></div><div class="step"><span class="mark">구간 03</span><p class="name">정산 회신</p><div class="note"><b>최종 수량의 대조</b><p>자재 사용량과 추가 작업 내역을 맞춰 보고 차이가 있는 금액은 근거를 붙여 알립니다.</p></div></div></div>

<div class="card quiet" data-el="rulemark-card" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="parts"><p class="kick">01</p><p class="name">거점 운영의 표준화</p><p class="note">지역마다 달랐던 문의 기록 양식을 통일하고 고객의 요청을 같은 항목으로 분류했습니다. 안내 내용을 빠르게 찾도록 자료를 모았으며 처리 결과는 현장 담당자가 함께 검토합니다. 반복되는 문제는 원인을 찾아 개선 과제에 담습니다.</p></div></div>

<div class="versus" data-el="rulemark-versus--dotted-transfer" style="grid-column:1 / span 12;grid-row:1 / span 6" ><section class="side"><h3 class="name">수작업 운영</h3><div class="copy"><h4 class="kick">현장마다 다른 기준</h4><div class="note"><p>거점별 기록 양식이 달라 출고 현황을 다시 집계했습니다. 지연 원인을 확인할 때마다 담당자를 찾아야 했고, 고객 문의에 답하기까지 대기 시간이 길어졌습니다.</p></div></div></section><b class="vs" aria-label="개선 방향"></b><section class="side on"><h3 class="name">통합 관제</h3><div class="copy"><h4 class="kick">하나로 모인 대응</h4><div class="note"><p>공통 대시보드에서 처리 순서를 확인하고 지연 건을 먼저 배정합니다. 현장 책임자가 같은 지표를 보므로 고객에게 안내할 예정 시각도 빠르게 확정합니다.</p></div></div></section></div>

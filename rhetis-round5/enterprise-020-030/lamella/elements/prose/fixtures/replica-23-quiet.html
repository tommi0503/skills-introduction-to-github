<div class="prose quiet" data-el="lamella-prose" style="grid-column:1 / span 12;grid-row:1 / span 6"><p>이 문서는 운영 현황과 다음 추진 방향을 설명하기 위해 작성했습니다.</p><p>기재된 전망은 현재 확인된 수요와 조직의 실행 역량을 바탕으로 검토했습니다.</p><p>향후 시장의 수요나 공급 여건에 따라 실행 순서와 일정이 달라질 수 있습니다.</p><p>계약과 관련된 세부 조건은 담당 부서를 통해 다시 확인해 주시기 바랍니다.</p></div>

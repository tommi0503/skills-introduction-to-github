<div class="card" data-el="lamella-card--white-step" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="parts"><p class="kick">검토 단계</p><h3 class="name">자료 확인과 분류</h3><div class="note"><p><span class="focus">목표: 접수 자료의 누락을 먼저 살핍니다.</span>- 절차: 담당 부서가 항목을 맞추고<br><span class="continuation">자료를 확인한 뒤 후속 요청을 모읍니다.</span><br>- 기준: 운영 이력과 상담 기록을 묶어<br><span class="continuation">요청이 반복되는 구간을 찾아냅니다.</span><br><span class="continuation">다음 담당자에게 확인 결과를 전달합니다.</span><br>- 효과: 같은 문의의 재접수를 줄이고<br><span class="continuation">처리 과정의 책임 범위를 분명히 합니다.</span></p></div></div></div>

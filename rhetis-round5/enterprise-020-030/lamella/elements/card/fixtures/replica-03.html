<div class="card" data-el="lamella-card" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="parts"><h3 class="name">주요 운영 과제</h3><div class="note"><p><b>거점별 수요 확인</b><span>지난 분기의 상담 기록을 묶어 업종별 구매 주기와 예상 발주량을 다시 살폈습니다.</span></p><p><b>도입 부담 완화</b><span>기존 장비를 그대로 쓰는 연동 절차를 마련해 초기 준비 비용과 현장 대기 시간을 낮췄습니다.</span></p><p><b>반복 업무 개선</b><span>자주 생기는 오류부터 안내 방식을 바꾸고 담당 부서가 후속 결과를 함께 점검했습니다.</span></p></div></div></div>

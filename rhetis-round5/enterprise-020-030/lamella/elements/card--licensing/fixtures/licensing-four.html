<div class="card " data-el="lamella-card--licensing" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="parts"><h3 class="name">지역 공급과 후속 지원</h3><div class="note"><section><b>기본 조건</b><p>연간 운영 범위를 먼저 맞춥니다.</p></section><section><b>협력 절차</b><p>구매 부서와 적용 부서가 모여<br>설치 이후의 점검 일정을 정합니다.</p></section><section><b>지원 체계</b><p>긴급 문의는 전담 창구로 모으고<br>조치 결과를 담당자에게 전합니다.</p></section><section><b>비용 검토</b><p>반복 투입되는 인력과 시간을<br>항목별로 나눠 예산에 반영합니다.</p></section></div></div></div>

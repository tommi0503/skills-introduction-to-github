<div class="card " data-el="lamella-card--licensing" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="parts"><h3 class="name">협력 운영 계약</h3><div class="note"><section><b>수익 방식</b><p>거점 단위로 이용료를 받습니다.</p></section><section><b>계약 기준</b><p>사용 부서와 연동 범위를 정하고<br>기본 지원의 책임을 합의합니다.</p></section><section><b>협력 대상</b><p>지역별 공급사와 함께 도입하고<br>후속 지원 창구를 연결합니다.</p></section><section><b>운영 조건</b><p>사용량을 분기마다 함께 점검해<br>필요한 지원 범위를 조정합니다.</p></section><section><b>확대 근거</b><p>누적된 운영 자료를 활용해<br>새 거점의 준비 부담을 줄입니다.</p></section></div></div></div>

<div class="card " data-el="lamella-card--compact" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="parts"><h3 class="name">운영 속도</h3><div class="note"><section><b>처리 순서 점검</b><p>접수 기록을 부서별로 묶고<br>누락된 요청부터 확인한 뒤<br>담당자가 처리 순서를 정했습니다.</p></section><section><b>지원 창구 정비</b><p>자주 들어오는 문의를 모아<br>안내 기준을 다시 맞추고<br>진행 상황을 함께 공유했습니다.</p></section><section><b>반복 비용 절감</b><p>같은 작업이 이어지는 구간을<br>매주 살펴 조정한 결과를<br>다음 분기 예산에 반영했습니다.</p></section></div></div></div>

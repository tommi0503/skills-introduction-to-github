l-hub--semicircle"><div class="core">핵심 가치<small>Value</small></div><div class="spoke"><b class="name">정직</b></div><div class="spoke"><b class="name">신뢰</b></div><div class="spoke"><b class="name">도전</b></div><div class="spoke"><b class="name">혁신</b></div><div class="perimeter"></div></div></div><div class="stack"><div class="panel ruled" data-slot="value-r-0"><div class="bar"><b class="name">균형 잡힌 배치</b></div><div class="content"><div class="prose " data-el="crossrail-prose"><p>위아래 순서가 있는 목록형과 달리 원형 배치는 모든 요소를 동등한 비중으로 다룹니다.</p></div></div></div><div class="panel ruled" data-slot="value-r-1"><div class="bar"><b class="name">정보의 생태 사이클</b></div><div class="content"><div class="prose " data-el="crossrail-prose"><p>시선이 중앙에서 시작해 바깥으로 자연스럽게 이동하며 정보의 위계와 관계를 파악합니다.</p></div></div></div></div></div></div></div></section><script src="../assets/lucide.min.js"></script><script src="../assets/render-icons.js"></script></body></html>

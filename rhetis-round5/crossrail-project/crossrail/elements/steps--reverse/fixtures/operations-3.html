<div class="steps " data-el="crossrail-steps--reverse" style="grid-column:1 / span 12;grid-row:1 / span 6;"><div class="step"><b class="mark">03</b><b class="name">수요접수</b><p class="note">발주 항목의 수량과 납품 주소를 대조한 뒤 요청 내역을 담당 구역에 전달합니다.</p></div><div class="step"><b class="mark">02</b><b class="name">자원배정</b><p class="note">보관 위치와 가용 인력을 확인하고 작업 묶음마다 필요한 장비를 준비합니다.</p></div><div class="step"><b class="mark">01</b><b class="name">출고검증</b><p class="note">포장 단위와 출하 순번을 맞추고 누락된 증빙이 없는지 최종 검수합니다.</p></div></div>

<div class="steps " data-el="crossrail-steps" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="step"><span class="mark">01</span><p class="name"><span class="icon" data-icon="target"></span>반출 신청</p><p class="note">정비실에서 부품 묶음을 신청하면 요청 시각과 배송 구역이 자동 저장됩니다.</p></div><div class="step"><span class="mark">02</span><p class="name"><span class="icon" data-icon="lightbulb"></span>재고 점검</p><p class="note">선반별 잔량을 대조하고 보관 기한이 먼저 끝나는 묶음부터 출고합니다.</p></div><div class="step"><span class="mark">03</span><p class="name"><span class="icon" data-icon="search"></span>포장 및 검수</p><p class="note">파손 위험이 높은 부품은 완충재를 추가하고 봉인 후 무게를 다시 잽니다.</p></div><div class="step"><span class="mark">04</span><p class="name"><span class="icon" data-icon="chart-no-axes-combined"></span>차량 탑재</p><p class="note">운송장과 적재 구역을 맞춘 다음 기사가 배차 시간을 확인합니다.</p></div><div class="step"><span class="mark">05</span><p class="name"><span class="icon" data-icon="target"></span>창고 인계</p><p class="note">도착 지점에서 수량을 세고 누락 건을 당일 접수 목록으로 되돌립니다.</p></div></div>

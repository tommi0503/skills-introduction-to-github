<div class="steps" data-el="crossrail-steps--vertical" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="step"><span class="mark"><span class="icon" data-icon="boxes"></span>01</span><p class="name">분류</p><p class="note">도착한 수리 물품을 장비 종류별로 묶고 담당 창구를 지정해 접수 누락을 막습니다.</p></div><div class="step"><span class="mark"><span class="icon" data-icon="clipboard-check"></span>02</span><p class="name">진단</p><p class="note">작동 기록과 점검 항목을 대조한 뒤 교체가 필요한 부품의 범위를 정합니다.</p></div><div class="step"><span class="mark"><span class="icon" data-icon="wrench"></span>03</span><p class="name">수선</p><p class="note">분해한 부품의 상태를 기록하고 새 부품을 장착한 뒤 통전 시험을 진행합니다.</p></div><div class="step"><span class="mark"><span class="icon" data-icon="truck"></span>04</span><p class="name">반출</p><p class="note">검사표와 운송장을 묶어 보관하며 수령자의 서명 기록이 들어오면 접수를 닫습니다.</p></div></div>

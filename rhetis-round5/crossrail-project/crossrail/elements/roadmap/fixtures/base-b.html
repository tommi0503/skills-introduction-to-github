<!-- min:8x4 -->
<div class="roadmap" data-el="crossrail-roadmap" style="grid-column:1 / span 12;grid-row:1 / span 6;--cols:4">
  <div class="heads"><span>회수</span><span>정비</span><span>배차</span><span>접수</span></div>
  <div class="lane"><b class="name">배차</b><div class="range" style="--from:0;--to:2"></div><div class="bar" style="--from:0;--to:2"><span>봉인 점검</span></div><div class="bar on" style="--from:2;--to:4"><span>예비 부품 창고</span></div></div>
  <div class="lane"><b class="name">정비</b><div class="bar" style="--from:0;--to:3"><span>분실 물품 회수</span></div><span class="mile" style="--at:3"><span>수리 접수</span></span></div>
  <div class="lane"><b class="name">보관</b><div class="bar tone-2" style="--from:1;--to:4"><span>남부 정비 창구</span></div></div>
  <div class="lane"><b class="name">정비</b><div class="range" style="--from:0;--to:1"></div><div class="bar tone-3" style="--from:0;--to:1"><span>반출</span></div><div class="bar tone-3" style="--from:2;--to:3"><span>정비</span></div></div>
</div>

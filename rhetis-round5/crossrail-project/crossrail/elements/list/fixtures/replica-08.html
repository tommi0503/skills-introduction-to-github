<div class="list divided" data-el="crossrail-list" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="item"><b class="name">정비</b><p class="note">파손 신고가 들어오면 봉인 사진과 인수 시각을 함께 보관해 수리실로 전달합니다.</p></div><div class="item"><b class="name">접수</b><p class="note">지점마다 반납한 장비를 묶어 통전 시험을 진행하며 누락된 부품은 별도 보관합니다.</p></div><div class="item"><b class="name">반출</b><p class="note">도착한 포장물을 운송장 번호와 맞춘 뒤 선반별 접수 대장에 남깁니다.</p></div></div>

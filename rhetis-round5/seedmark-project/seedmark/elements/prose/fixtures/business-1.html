<div class="prose" data-el="seedmark-prose" style="grid-column:1 / span 12;grid-row:1 / span 6"><p>각 부서의 승인 흐름을 살피고 검토 기준을 정합니다.<br>현장 접수 항목을 담당 권한과 함께 한 문서로 묶습니다.<br>월별 납기 자료를 비교하며 지연된 사유를 분류합니다.<br>실무 검토를 마친 항목부터 집행 순서를 조율합니다.<br>협업 부서는 변경 내역을 근거 자료와 함께 남깁니다.<br>시험 도입의 결과를 살펴 개선할 부분을 골라냅니다.<br>발주 항목과 예산을 연결해 운영 손익을 점검합니다.<br>확정한 실행안을 다음 분기 협업 일정에 반영합니다.</p></div>

<div class="prose" data-el="seedmark-prose" style="grid-column:1 / span 12;grid-row:1 / span 6"><p>신규 거래처의 접수 항목을 기준에 따라 나눕니다.<br>담당 부서마다 달랐던 확인 절차를 함께 정리합니다.<br>누락된 검토 근거는 책임자가 차례로 보완합니다.<br>조달 품목의 납기와 수량을 주간 단위로 살핍니다.<br>예산 심사에는 실제 발주 내역과 변경 사유를 덧붙입니다.<br>협업사의 요청은 우선순위를 합의한 뒤 처리합니다.<br>완료한 업무를 근거로 다음 집행 일정을 확정합니다.<br>실행 과정에서 얻은 기록은 차기 계획에 반영합니다.</p></div>

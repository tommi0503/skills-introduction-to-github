<div class="prose" data-el="onboard-docket-prose--compact" style="grid-column:1 / span 12;grid-row:1 / span 6"><p>사업 기획팀은 지역별 계약 현황을 살피고 갱신 대상의 우선순위를 정했습니다. 영업 담당자가 협의에 필요한 자료를 빠르게 찾도록 주요 조건과 승인 근거를 연결했습니다.</p><p>다음 분기에는 현장 요청을 유형별로 묶어 제안서 작성 시간을 줄입니다. 변경 이력을 남겨 담당자가 바뀌어도 협의 배경을 확인하도록 하고, 검토 기한이 임박한 안건부터 책임자를 배정합니다.</p></div>

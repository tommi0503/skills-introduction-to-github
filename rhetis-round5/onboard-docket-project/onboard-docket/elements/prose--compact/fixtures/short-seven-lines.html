<div class="prose" data-el="onboard-docket-prose--compact" style="grid-column:1 / span 12;grid-row:1 / span 6"><p>월간 계약 점검에서는 갱신 일정과 협의 상태를 먼저 살핍니다.<br>가격 변경이 필요한 안건은 담당자의 검토 의견을 붙입니다.<br>예산 협의가 끝난 항목부터 결재 순서에 따라 전달합니다.<br>지역별 문의는 지정된 채널로 모아 담당자를 배정합니다.<br>납기 조정이 생기면 협력 조직과 합의한 날짜를 기록합니다.<br>검증 자료가 빠진 건은 별도로 표시해 재확인을 요청합니다.<br>다음 회의 전까지 처리 경과와 남은 쟁점을 정리합니다.</p></div>

<!-- min: 9x4 -->
<div class="swimlane" data-el="confluence-swimlane" style="grid-column:1 / span 12;grid-row:1 / span 6;--cols:4">
  <div class="lane" style="grid-row:1"><b class="name">접수 담당</b></div>
  <div class="lane" style="grid-row:2"><b class="name">배차 담당</b></div>
  <div class="lane" style="grid-row:3"><b class="name">검수 담당</b></div>
  <div class="node start to-d" style="grid-column:1; grid-row:1"><b class="name">주문 접수</b></div>
  <div class="node to-r" style="grid-column:1; grid-row:2"><b class="name">조건 확인</b></div>
  <div class="node ask to-r" style="grid-column:2; grid-row:2"><b class="name">배차 배정</b></div>
  <div class="node to-d" style="grid-column:3; grid-row:2"><b class="name">수량 검수</b></div>
  <div class="node to-r" style="grid-column:3; grid-row:3"><b class="name">예외 협의</b></div>
  <div class="node end" style="grid-column:4; grid-row:3"><b class="name">인계 완료</b></div>
</div>

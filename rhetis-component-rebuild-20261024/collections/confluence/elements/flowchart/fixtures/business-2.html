<!-- min: 9x4 -->
<div class="flowchart" data-el="confluence-flowchart" style="grid-column:1 / span 12;grid-row:1 / span 6">
  <div class="node start to-r" style="grid-column:1; grid-row:1"><b class="name">현장 접수</b></div>
  <div class="node to-r" style="grid-column:2; grid-row:1"><b class="name">수량 검수</b></div>
  <div class="node ask to-r to-d" style="grid-column:3; grid-row:1"><b class="name">인계 판단</b></div>
  <div class="node end" style="grid-column:4; grid-row:1"><b class="name">배송 출발</b></div>
  <div class="node to-l" style="grid-column:3; grid-row:2"><b class="name">차량 대기</b></div>
  <div class="node to-u" style="grid-column:2; grid-row:2"><b class="name">재검수 요청</b></div>
</div>

<div class="code" data-el="diecut-code" style="grid-column:1 / span 12;grid-row:1 / span 6"><b class="name">pending_records.py</b><div class="lines"><p><span class="k">def</span> collect_pending(records):</p><p>    pending = []</p><p>    <span class="k">for</span> item <span class="k">in</span> records:</p><p>        <span class="k">if</span> item[<span class="s">"checked"</span>]:</p><p>            <span class="k">continue</span></p><p>        pending.append({</p><p>            <span class="s">"office"</span>: item[<span class="s">"office"</span>],</p><p>            <span class="s">"owner"</span>: item[<span class="s">"owner"</span>],</p><p>            <span class="s">"next_review"</span>: <span class="n">7</span>,</p><p>        })</p><p>    <span class="k">return</span> pending</p><p><span class="c"># 다음 검토 대상과 확인 책임을 묶어 보관</span></p></div></div>

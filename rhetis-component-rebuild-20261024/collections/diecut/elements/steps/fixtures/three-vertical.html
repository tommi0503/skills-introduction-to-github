<div class="steps col" data-el="diecut-steps" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="step"><b class="mark">PHASE 01.</b><b class="name">입력 항목 취합</b><p class="note">권역 담당자가 접수 기록을 모읍니다.<br>누락된 항목을 먼저 확인합니다.<br>정해진 서식에 맞춰 제출합니다.</p></div><div class="step"><b class="mark">PHASE 02.</b><b class="name">원본 자료 대조</b><p class="note">전월에 확정한 기록과 대조합니다.<br>중복 자료는 목록에 표시합니다.<br>근거 문서를 함께 보관합니다.</p></div><div class="step"><b class="mark">PHASE 03.</b><b class="name">차이 원인 검토</b><p class="note">수량과 날짜의 차이를 살펴봅니다.<br>담당 부서의 회신을 기다립니다.<br>해석이 다른 항목을 구분합니다.</p></div></div>

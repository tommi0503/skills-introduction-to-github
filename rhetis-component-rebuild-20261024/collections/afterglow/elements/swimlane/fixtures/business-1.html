<!-- min: 9x4 -->
<div class="swimlane" data-el="afterglow-swimlane" style="grid-column:1 / span 12;grid-row:1 / span 6;--cols:3">
  <div class="lane" style="grid-row:1"><b class="name">접수 담당</b></div>
  <div class="lane" style="grid-row:2"><b class="name">배차 담당</b></div>
  <div class="node start to-d" style="grid-column:1; grid-row:1"><b class="name">주문 접수</b></div>
  <div class="node to-r" style="grid-column:1; grid-row:2"><b class="name">조건 확인</b></div>
  <div class="node end to-u" style="grid-column:2; grid-row:2"><b class="name">배차 배정</b></div>
  <div class="node" style="grid-column:2; grid-row:1"><b class="name">수량 검수</b></div>
</div>

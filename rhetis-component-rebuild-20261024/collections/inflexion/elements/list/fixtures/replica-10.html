<div class="list" data-el="inflexion-list" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="item"><span class="mark"><span class="icon" data-icon="circle-help"></span></span><p class="name">냉장화물 적재 기준</p><p class="note">검수 대기 화물의 수량을 예외 항목부터 우선 심사해 둡니다. 배차 협의의 근거가 명확해집니다.</p></div><div class="item"><span class="mark"><span class="icon" data-icon="circle-help"></span></span><p class="name">권역별 정산 체계</p><p class="note">저온 거점의 출고 빈도를 예외 항목부터 우선 심사해 둡니다. 비수기 공차를 줄일 수 있습니다.</p></div><div class="item"><span class="mark"><span class="icon" data-icon="circle-help"></span></span><p class="name">운임 청구 대조표</p><p class="note">반품 상자의 보관 위치를 예외 항목부터 우선 심사해 둡니다. 교대 기록을 차수별로 묶어 둡니다.</p></div></div>

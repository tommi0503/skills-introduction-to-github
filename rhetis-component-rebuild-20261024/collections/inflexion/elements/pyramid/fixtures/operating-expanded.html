<div class="pyramid" data-el="inflexion-pyramid" style="grid-column:1 / span 12; grid-row:1 / span 6"><div class="level"><b class="name">권역별 정산 체계</b><p class="note">냉장 화물의 적재 순서를 자동 검증 절차에 반영합니다.</p></div><div class="level"><b class="name">운임 청구 대조표</b><p class="note">빈 상자의 이동을 줄입니다. 물류센터의 대기열이 짧아집니다.</p></div><div class="level"><b class="name">운임 청구 대조표</b><p class="note">창고별 입고 순서를 담당 조직과 함께 대조합니다. 권역 간 편차를 좁힙니다.</p></div><div class="level"><b class="name">냉장화물 적재 기준</b><p class="note">지점별 재고 보충 시점을 주간 단위로 재배치합니다.</p></div><div class="level"><b class="name">권역별 정산 체계</b><p class="note">미수 사유를 부서별로 나눕니다. 권역 간 편차를 좁힙니다.</p></div></div>

<div class="matrix " data-el="dockside-matrix" style="grid-column:1 / span 12;grid-row:1 / span 6"><div class="axis-x"><span>낮은 운임</span><span>높은 운임</span></div><div class="axis-y"><span>낮은 회차</span><span>높은 회차</span></div><div class="cell"><b class="name">입고 회차 확대</b><p class="note">낮은 운임으로 야간 접수 물량을 확보한다.</p></div><div class="cell on"><b class="name">전용 차량 계약</b><p class="note">높은 회차를 유지할 화주를 우선 심의한다.</p></div><div class="cell"><b class="name">공동 집하 유지</b><p class="note">산지 물량이 모이는 시각에 맞춰 운행한다.</p></div><div class="cell"><b class="name">검수 창구 분리</b><p class="note">마감이 늦은 납품처는 별도 편으로 묶는다.</p></div></div>
